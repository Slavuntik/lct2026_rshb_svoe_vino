[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winescan"
version = "0.1.0"
description = "Сканер российских вин по фото этикетки для каталога «Своё вино» (ЛЦТ 2026, кейс РСХБ)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "imagehash>=4.3",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
