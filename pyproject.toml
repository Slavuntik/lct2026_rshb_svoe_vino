[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winescan"
version = "0.1.0"
description = "Сканер российских вин по фото этикетки для каталога «Своё вино» (ЛЦТ 2026, кейс РСХБ)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "imagehash>=4.3",
    "pyarrow>=15",
    "scipy>=1.11",
]

[project.optional-dependencies]
# слои 1–4: модели и сервис; torch с CUDA ставится отдельно (см. README.md)
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.56",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
