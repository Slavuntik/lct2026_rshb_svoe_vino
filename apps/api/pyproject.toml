[project]
name = "svoy-somelye-api"
version = "0.1.0"
description = "FastAPI-приложение «Свой Сомелье» по contracts/openapi.yaml"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "psycopg[binary]>=3.1",
    "llm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# v0.3 (ревью 02, п.7) + кейс ЛЦТ (интеграция с packages/cv): опциональная
# связка для tests/test_integration_real_rag.py и tests/test_integration_real_cv.py
# — настоящие packages/rag (агент A) и packages/cv (агент G), оба с тяжёлыми
# ML-зависимостями (embeddings/reranker/torch+transformers), поэтому НЕ в
# основных dependencies. Установка:
#   uv sync --extra dev --extra integration
# Без этой extra оба теста сами себя скипают (RAG_PROVIDER=real/IMAGE_PROVIDER=real
# не смогут импортировать rag/cv) — базовый прогон `uv sync --extra dev` их не требует.
integration = [
    "rag",
    "cv",
    # torch>=2.3 приходит ТРАНЗИТИВНО через cv (packages/cv/pyproject.toml) — но uv
    # применяет [tool.uv.sources] (ниже, CPU-only индекс для Linux) только к пакетам,
    # которые ЭТОТ pyproject.toml требует НАПРЯМУЮ, не к транзитивным требованиям
    # path-зависимости (проверено эмпирически: без этой строки `uv lock
    # --upgrade-package torch` продолжал резолвить torch с обычного PyPI и тащить
    # cuda-toolkit/nvidia-* для linux, несмотря на source-override ниже). Явная
    # прямая запись здесь ничего не меняет по факту установки (версия та же,
    # что уже требует cv) — только даёт uv повод посмотреть в [tool.uv.sources].
    "torch>=2.3",
]
# ПРИМЕЧАНИЕ (v0.4.4, ревью 04): на момент проверки этого шва packages/cv/
# pyproject.toml не объявлял pillow_heif как зависимость, хотя cv/imageio.py
# уже безусловно импортировал его (HEIC-приём) и обращался к атрибуту
# `pillow_heif.HeifError`, которого нет ни в одной версии пакета >=0.13
# (снесён между 0.12.0 и 0.13.0, проверено эмпирически перебором версий PyPI)
# — `import cv.index` падал сначала ModuleNotFoundError, потом AttributeError
# при импорте модуля. К моменту, когда дошли руки писать локальный воркэраунд
# здесь, агент G уже чинила это же самое в РАБОЧЕЙ КОПИИ параллельно (см.
# packages/cv/pyproject.toml — pillow-heif>=0.18 и cv/imageio.py — обращение
# к HeifError убрано) — некоммиченное на момент этой правки, но уже
# исправляющее корень проблемы лучше, чем версийный пин здесь. Явной записи
# для pillow-heif в этом файле поэтому больше нет: она приходит транзитивно
# через зависимость cv, как и положено.

[tool.uv.sources]
llm = { path = "../../packages/llm", editable = true }
rag = { path = "../../packages/rag", editable = true }
cv = { path = "../../packages/cv", editable = true }
# E3-do-ams3: БЕЗ этого torch (тянется транзитивно через cv>=2.3, packages/cv/pyproject.toml
# — не трогаем тот файл, не наша зона) резолвится с PyPI и на sys_platform=="linux" тащит
# ПОЛНЫЙ CUDA-стек (проверено по факту в uv.lock ДО этой правки: cuda-bindings,
# cuda-toolkit[cublas,cudart,cufft,cufile,cupti,curand,cusolver,cusparse,nvjitlink,nvrtc,nvtx],
# nvidia-cudnn-cu13/-cusparselt-cu13/-nccl-cu13/-nvshmem-cu13 — 47 пакетов nvidia-*/cuda-*
# в локе, десятки лишних сотен МБ поверх и без того немаленького torch-колеса) — образ
# infra/Dockerfile.api строится на python:3.12-slim (Linux) и деплоится на дроплет БЕЗ GPU,
# CUDA там не будет использована никогда. index.explicit=true — источник применяется ТОЛЬКО
# к torch (marker сузивает его дальше до линуксовых колёс), никакой другой пакет тайно с
# него резолвиться не может (защита uv по умолчанию для не-PyPI индексов). На macOS
# (sys_platform=="darwin", дев-машина) marker не совпадает — там как и раньше PyPI, обычное
# CPU/MPS-колесо torch для arm64, никакого effect'а на локальную разработку.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: настоящие packages/rag (RUN_RAG_INTEGRATION=1) / packages/cv (RUN_CV_INTEGRATION=1); скип по умолчанию (см. tests/test_integration_real_rag.py, tests/test_integration_real_cv.py)",
]
