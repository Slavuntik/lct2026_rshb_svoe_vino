[project]
name = "svoy-somelye-api"
version = "0.1.0"
description = "FastAPI-приложение «Свой Сомелье» по contracts/openapi.yaml"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "psycopg[binary]>=3.1",
    "llm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# v0.3 (ревью 02, п.7): опциональная связка для tests/test_integration_real_rag.py
# — настоящий packages/rag агента A (embeddings/reranker/qdrant-embedded, тяжёлые
# зависимости, поэтому НЕ в основных dependencies). Установка:
#   uv sync --extra dev --extra integration
# Без этой extra тест сам себя скипает (RAG_PROVIDER=real не сможет импортировать
# rag) — базовый прогон `uv sync --extra dev` его не требует.
integration = [
    "rag",
]

[tool.uv.sources]
llm = { path = "../../packages/llm", editable = true }
rag = { path = "../../packages/rag", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: настоящий packages/rag + собранный индекс A; скип по умолчанию, вкл. RUN_RAG_INTEGRATION=1 (см. tests/test_integration_real_rag.py)",
]
