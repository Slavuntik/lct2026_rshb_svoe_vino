[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf-finder-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pillow>=10.4", "numpy>=1.26"]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "onnxruntime>=1.20,<2", "opencv-python-headless>=4.10,<6"]
accuracy = ["transformers>=5,<6", "rapidocr>=3.9,<4", "huggingface-hub>=1,<2"]
vlm = ["httpx>=0.27,<1"]
test = ["pytest>=8", "httpx>=0.27", "anyio>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
