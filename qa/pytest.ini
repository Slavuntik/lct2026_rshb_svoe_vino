[pytest]
# qa/.venv и qa/packs (сгенерированные паки) не должны попадать в сбор тестов.
norecursedirs = .venv packs node_modules __pycache__ *.egg-info
markers =
    network: делает реальные вежливые HEAD-запросы к vino-svoe.ru (см. agents/F-qa-demo.md, "Не делать")
    e2e: сквозной сценарий через Playwright против apps/web в mock-режиме (поднимает свой dev-server)
