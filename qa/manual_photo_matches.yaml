# --------------------------------------------------------------------------------------
# D1 (agents/D1-ref-collisions.md, 21.09.2026): разбор коллизий ИМЕНИ ФАЙЛА — не
# путать с F4 выше (F4 = имя фото в CSV настолько отличалось от файла, что матчер вообще
# промахнулся). Здесь матчер НАШЁЛ >1 физический файл с одинаковым нормализованным
# стемом (`Screenshot_7.webp`, `Shardone.webp`, `мерло.webp`... — общие/родовые имена,
# под которыми РАЗНЫЕ винодельни грузили СВОИ фото в Strapi) и `resolve_best_candidate()`
# (площадь фото) мог выбрать афишу/чужую бутылку/виноградник вместо своей бутылки —
# см. находку оркестратора в agents/D1-ref-collisions.md. Разобрано ГЛАЗАМИ (Read):
# все 66 слогов slug_refs.json["multi_candidate_slugs"] + 10 слогов с usable=false и
# заданным ref_quality_class (пересечение — 9 из 10; вне пересечения — ona-skazala-da,
# единственный кандидат) = 67 разных слогов. Контакт-листы (PIL, кандидат = файл+хэш+
# разрешение, шапка = slug/винодельня/название/цвет/сорт из case_catalog.json) —
# case-data/ref-review/sheets/ (вне git, не входит в поставку).
#
# Формат ЗДЕСЬ — YAML-СПИСОК `[chosen, *extra]`, не строка (расширение схемы, см.
# load_manual_matches/run_matcher в qa/case_census.py). В отличие от строковой формы
# F4 выше, список ПРИМЕНЯЕТСЯ, ДАЖЕ ЕСЛИ автоматика уже что-то выбрала — это и есть
# починка коллизии, не "второе мнение поверх уже успешного матча". Второй и следующие
# элементы (если есть) — другой РЕАЛЬНЫЙ ракурс ТОЙ ЖЕ бутылки, подтверждённый вручную;
# уходят в новое поле `extra_refs` и ТОЛЬКО они индексируются доп. ракурсами —
# cv/cli.py::discover_refs_from_slug_refs_json (обновлён вместе с census, см. тесты
# там же) больше не доверяет сырому `candidates` как источнику доп. ракурсов, именно
# потому что для коллизий это чужие бутылки/афиши под чужим слогом. Пустой список `[]`
# — явное решение "ни один из candidates не подходит, слог честно без эталона"
# (п.3 брифа) — сомнение разрешается ИСКЛЮЧЕНИЕМ, не угадыванием.
#
# Ни один слог не тронут "на всякий случай": 15 ниже — реальная починка (auto-chosen
# был чужим файлом), 3 — явный отказ (единственное доступное фото — чужое вино,
# доказано текстом на этикетке/буквальным совпадением photo_csv с соседним слогом).
