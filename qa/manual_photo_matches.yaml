# qa/manual_photo_matches.yaml
#
# Агент F4 (reports/f4-data-hygiene.md, задача 2) — ручной словарь slug -> файл
# uploads/ для 76 слогов из case-data/slug_refs.json -> unmatched_by_name (все —
# match_method=weak_lexical_overlap, автоматический матчер qa/case_census.py не
# нашёл уверенного кандидата по ключу/подстроке). Метод разбора (полный отчёт —
# reports/f4-data-hygiene.md):
#
# 1) Разделитель-нечувствительное точное сравнение: normalize_key(), но со ВСЕМИ
#    '_' тоже вырезанными (не только схлопнутыми в normalize_key) — и из CSV-имени,
#    и из имени файла в uploads/. Закрывает 72/76: Strapi при аплоаде вставляет
#    доп. '_' на границах регистра ВНУТРИ непрозрачных ID (напр. 'CG6OxkC' в CSV ->
#    файл 'CG_6_Oxk_C'), из-за чего обычный матчер по подстроке не совпадает, хотя
#    это буквально тот же файл. Ложных срабатываний не ожидается (нужно совпадение
#    ВСЕЙ строки идентификатора целиком, не общих слов) — выборочно перепроверено
#    визуально (Read на сам файл), 3 случая ('Массандра Кокур Авторское',
#    'Новый Свет Каберне Совиньон Полусладкое', 'Дербент Ди Каспико') — этикетка на
#    фото совпадает с ожиданием 1:1.
# 2) 1 слог (katharon-mezenka-risling-suhoe) — НЕ разделитель-нечувствительное
#    совпадение, только визуальная проверка: токен-фаззи по общим словам предлагал
#    2 кандидата с похожим счётом ('Risling_2024...' и 'Katharon_Risling_2025...'),
#    но Read на оба файла показал, что 'Risling_2024*' — ЧУЖАЯ винодельня LETO
#    (этикетка 'LETO ВИНОДЕЛЬНЯ'), не KATHARON — общие слова 'Risling'/'2024' её не
#    различают. 'Katharon_Risling_2025' — этикетка 'KATHARON ... РИСЛИНГ СУХОЕ
#    БЕЛОЕ 2025' — подтверждено визуально, точное совпадение винодельни и категории.
# 3) 6 слогов из п.1 имели ПО ДВА физических кандидата (файл переаплоужен с новым
#    хэш-суффиксом, тот же паттерн, что reports/f3-case-census.md §1.1.6) —
#    разрешено тем же правилом, что основной матчер (resolve_best_candidate):
#    большее разрешение (PIL), при равном разрешении — по алфавиту (детерминированно).
#
# 3 слога из 76 сюда НЕ попали — файл в поставке физически отсутствует (проверено
# точечно для каждого, не гипотеза):
#  - katharon-mezenka-risling-polusuhoe: в uploads есть KATHARON-рислинг (Risling_
#    2025 = сухое, см. п.2 выше) и LETO-рислинги обеих категорий (чужая винодельня) —
#    ни одного KATHARON-рислинга полусухое нет.
#  - fanagoriya-fanagoriya-hey-bey-shardone-beloe-suhoe-13: "Название фото" в CSV —
#    буквально сам slug (заглушка, не реальное имя файла); лучший фаззи-кандидат —
#    ДРУГАЯ линейка той же винодельни (Fanagoriya Декантер Шардоне, не Хей Бэй).
#  - vinodelnya-vedernikov-vedernikov-tsimlyanskiy-chyornyy-tsimlyanskiy-chernyy-
#    krasnoe-suhoe-14: у Ведерниковъ Цимлянский Чёрный в uploads есть только
#    варианты С категорией (резерв/брют-розе/брют-беле/розовый) — ни одного БЕЗ
#    категории (как в CSV/slug этой позиции) не нашлось.
#
# Формат: slug: filename.webp (имя файла в uploads/, без пути). Матчер в
# case_census.py консультирует этот файл ТОЛЬКО для слогов, которых не нашёл
# автоматический pipeline (no_ref_slugs/unmatched_by_name) — никогда не
# перекрывает уже успешный автоматический матч.

