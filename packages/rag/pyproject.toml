[project]
name = "rag"
version = "0.1.0"
description = "RAG-ядро «Свой Сомелье»: ingest, гибридный retrieval, resolve этикеток, аналог импортного."
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.9",
    "fastembed>=0.3",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]
