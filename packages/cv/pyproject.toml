[project]
name = "cv"
version = "0.1.0"
description = "CV-ядро сканера «Свой Сомелье»: аугментация 3D-ракурсов, нормализация фото, SigLIP 2, ImageIndex"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "transformers>=4.49",
    "torch>=2.3",
    "qdrant-client>=1.9",
    "sentencepiece>=0.2",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "rapidfuzz>=3.0",
    # agents/H2-rapidocr-multiscale.md: RapidOCR (ONNX Runtime) — быстрый CPU-путь OCR
    # (cv/ocr_rapid.py), CV_OCR_ENGINE=rapid в cv/verify.py. Тот же основной набор
    # зависимостей, что и paddleocr/paddlepaddle выше (не extra) — оба движка
    # ленивые (не тянут веса/сеть на импорт), но пакеты уже сейчас должны быть
    # доступны для CV_OCR_ENGINE=rapid без отдельной установки.
    "rapidocr>=3.9",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cv = "cv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
