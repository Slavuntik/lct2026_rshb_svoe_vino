[project]
name = "llm"
version = "0.1.0"
description = "LLM-адаптер «Свой Сомелье»: единый Protocol + драйверы deepseek/openai/gigachat/anthropic/mock"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
