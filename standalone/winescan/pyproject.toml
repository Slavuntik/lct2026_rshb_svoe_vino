[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winescan"
version = "0.1.0"
description = "Сканер российских вин по фото этикетки для каталога «Своё вино» (ЛЦТ 2026, кейс РСХБ)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "imagehash>=4.3",
    "pyarrow>=15",
    "scipy>=1.11",
]

[project.optional-dependencies]
# слои 1–4: модели и сервис; torch с CUDA ставится отдельно (см. README.md)
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.56",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "easyocr>=1.7",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "httpx>=0.27"]
# только для опыта `winescan.eval.ocr_compare` (PP-OCRv5 против EasyOCR): в образ сервиса не входит.
# PaddlePaddle не годится — он требует AVX2, которого нет на машине проекта; модели берутся в ONNX
ocr-compare = ["rapidocr-onnxruntime>=1.4", "onnxruntime>=1.20", "huggingface-hub>=0.24", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
