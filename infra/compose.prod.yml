# infra/compose.prod.yml — PROD-контур «Свой Сомелье» на Contabo VPS (EU), за Cloudflare.
#
# Топология (см. ../../docs/architecture.html, разделы «Схема деплоя» и «Как катим»):
#   Cloudflare (DNS, TLS-прокси, WAF) --443--> nginx (origin-cert) --> api (uvicorn, внутренняя сеть)
#                                                                   --> qdrant (внутренняя сеть)
#                                                                   --> postgres (внутренняя сеть)
#
# Запуск на хосте (см. infra/RUNBOOK.md):
#   docker compose -p prod -f infra/compose.prod.yml pull
#   docker compose -p prod -f infra/compose.prod.yml up -d
#
# ВАЖНО: -p prod обязателен. Prod и staging живут на ОДНОМ хосте как два НЕЗАВИСИМЫХ
# compose-проекта (infra/scripts/deploy.sh всегда передаёт -p явно) — без него Compose
# по умолчанию берёт имя проекта из имени каталога, и оба контура схлопнутся в один
# (общие тома/сеть/имена контейнеров), что означает общую БД prod+staging. Дважды проверено
# в deploy.sh явным -p, но держим в уме при ручных запусках.
#
# Секреты — только через infra/.env (на хосте, chmod 600, НЕ в git). Шаблон значений
# и их смысл — infra/.env.prod.example и infra/RUNBOOK.md, раздел «Секреты».
#
# Лимиты памяти посчитаны на «пол» VPS 8 ГБ, разделённый с compose.staging.yml на этом же
# хосте (см. infra/RUNBOOK.md, раздел «Память: как считали»). На 16 ГБ есть запас на пики
# (одновременный backup + ingest + чат под нагрузкой демо) — так и планировалось изначально.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: somelye-prod-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"     # редирект на 443 (см. nginx.conf); Cloudflare тоже умеет force-HTTPS,
                     # держим и на origin — на случай прямого обращения/мониторинга
      - "443:443"   # Cloudflare Full (strict) -> origin-cert ниже
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/somelye/tls:/etc/nginx/tls:ro                      # origin.crt + origin.key, см. RUNBOOK
      - /opt/somelye/prod/releases/current:/usr/share/nginx/html:ro   # апдейтится deploy.sh (симлинк)
      - nginx_cache:/var/cache/nginx
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.5
    healthcheck:
      # busybox wget входит в nginx:alpine "из коробки" — не требует установки доп. пакетов.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: ${API_IMAGE:-ghcr.io/svoysomelye/svoy-somelye-api}:${API_IMAGE_TAG:-latest}
    # Локальная сборка (если образ ещё не опубликован в GHCR):
    #   docker compose -p prod -f infra/compose.prod.yml build api
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: somelye-prod-api
    restart: unless-stopped
    env_file:
      # ../.env, а не .env: путь в env_file всегда резолвится относительно каталога ЭТОГО
      # compose-файла (infra/), а секреты по RUNBOOK лежат в /opt/somelye/prod/.env — на
      # уровень выше infra/. См. infra/.env.prod.example — реальный файл только на хосте.
      - ../.env
    environment:
      # ИСПРАВЛЕНО по ревью 02 (было RAG_QDRANT_URL — переменная, которую никто не читает).
      # Реальные имена — проверено по коду: apps/api/app/rag/factory.py читает RAG_PROVIDER
      # (mock|real, дефолт mock — здесь явно real, иначе всё нижеперечисленное не используется
      # вообще); packages/rag/rag/base.py::get_retriever() читает RAG_MODE (embedded|qdrant,
      # дефолт embedded) и, при RAG_MODE=qdrant, бросает исключение без QDRANT_URL
      # (packages/rag/rag/config.py — переменная БЕЗ префикса RAG_, в отличие от RAG_QDRANT_PATH
      # для embedded-режима — так называет её сам пакет, не переименовывать на своей стороне).
      RAG_PROVIDER: real
      RAG_MODE: qdrant
      QDRANT_URL: http://qdrant:6333
      # Сайдкар-артефакты ingest'а (payloads/bm25/labels/manifest — Qdrant они не хранит,
      # см. packages/rag/rag/config.py: PAYLOADS_DIR/BM25_DIR/LABELS_PATH/MANIFEST_PATH).
      # Публикуются infra/scripts/publish-index.sh в volume ниже, читаются один раз при
      # старте api (get_retriever() вызывается в create_app()) — обновление требует restart
      # api, publish-index.sh делает это сам после переключения симлинка.
      RAG_DATA_DIR: /data/rag
      # Кэш моделей эмбеддинга/реранкера (fastembed -> huggingface_hub). Демо-критично
      # (см. reports/e-report.md, риск из ревью 02, взят в работу немедленно оркестратором):
      # без персистентного тома контейнер после КАЖДОГО restart/пересоздания качал бы
      # модели с HF Hub заново — по замерам агента A реранкер качается ~112с (RAG_RERANKER_MODEL
      # = jinaai/jina-reranker-v2-base-multilingual, ~1.1GB, см. packages/rag/rag/config.py) —
      # неприемлемо посреди демо-показа. Имя переменной проверено ПО КОДУ, а не по документации
      # fastembed: packages/rag/rag/embeddings.py (DenseEmbedder) и rag/rerank.py
      # (CrossEncoderReranker) явно передают cache_dir=str(config.FASTEMBED_CACHE_DIR) в
      # fastembed.TextEmbedding/TextCrossEncoder; config.py собирает FASTEMBED_CACHE_DIR из
      # RAG_FASTEMBED_CACHE. Раз cache_dir передан явно, fastembed НЕ смотрит ни на свой
      # собственный FASTEMBED_CACHE_PATH, ни на HF_HOME (проверено: fastembed/common/utils.py
      # ::define_cache_dir читает FASTEMBED_CACHE_PATH только когда cache_dir is None; сам
      # huggingface_hub.snapshot_download вызывается из fastembed/common/model_management.py
      # с cache_dir=cache_dir явным аргументом, который тоже перебивает HF_HOME). Правильное и
      # единственное имя для ЭТОГО кода — RAG_FASTEMBED_CACHE.
      RAG_FASTEMBED_CACHE: /data/fastembed-cache
      # postgresql+psycopg (psycopg3, синхронный) — под sqlalchemy.create_engine в
      # apps/api/app/db.py (СИНХРОННЫЙ engine, не asyncpg). Драйвер psycopg[binary] пока
      # не в apps/api/pyproject.toml — см. reports/e-report.md, «Блокеры».
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      ENVIRONMENT: prod
      # --- CV-стек (сканер по фото, contracts/image-scan.md) — E3-do-ams3 -----------------
      # IMAGE_PROVIDER/VERIFIER_PROVIDER: apps/api/app/config.py, дефолт в коде — "mock";
      # здесь ЯВНО "real" (проверено по apps/api/app/cv/factory.py — иначе packages/cv и
      # тома ниже не используются вообще, сканер работает на фикстурах). Значения по
      # умолчанию для CV_* — эталон живого стенда оркестратора (reports/e3-do-ams3.md).
      IMAGE_PROVIDER: real
      VERIFIER_PROVIDER: real
      # CV_DATA_DIR — packages/cv/cv/config.py: DATA_DIR; QDRANT_PATH и MANIFEST_PATH
      # считаются ОТ НЕГО (DATA_DIR/qdrant, DATA_DIR/qdrant/manifest.json — манифест лежит
      # ВНУТРИ qdrant-каталога, не рядом; проверено по факту в cv/index.py и на диске:
      # packages/cv/data/qdrant/manifest.json, НЕ packages/cv/data/manifest.json — второй
      # файл существует, но это осиротевший артефакт одного из прогонов pytest, ImageIndex
      # его не читает). Том cv_index ниже наполняется КОПИЕЙ ЦЕЛОГО packages/cv/data/qdrant/ —
      # манифест лежит внутри этого каталога, отдельно катать не нужно. Конкретный механизм
      # доставки на диск хоста — предмет отдельного брифа (зависит от целевого хоста).
      CV_DATA_DIR: /data/cv
      # CASE_DATA_DIR — apps/api/app/cv/case_catalog.py (кириллические name/winery для
      # верификатора near-dup; без файла — честная деградация в {} и откат на
      # retriever.get_by_id(), НЕ падает, см. докстринг модуля) и packages/cv/cv/families.py
      # (near-dup семьи, $CASE_DATA_DIR/families.json). Дефолт в коде — Mac-путь дев-машины
      # (/Users/.../vines/case-data, 4+ ГБ ПОСТОРОННИХ файлов), на боевом хосте его нет и не
      # нужен ЦЕЛИКОМ — только 2 маленьких json (~2.5 МБ), см. том case_data ниже.
      CASE_DATA_DIR: /data/case
      # Пороги верификации near-dup — ЯВНО, не молчаливым дефолтом кода (apps/api/app/
      # config.py), чтобы хак-стенд не разъехался с калибровкой (F2, impostor-холдаут),
      # если дефолты кода когда-нибудь поменяют, а этот файл забудут свериться.
      CV_ABS_FLOOR: "0.82"
      CV_MARGIN_FLOOR: "0.02"
      CV_VERIFY_PROXIMITY: "0.04"
      # HF_HOME — официальная env huggingface_hub/transformers, единственная точка правды
      # для кэша SigLIP2 (~1.5 ГБ). HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE=1 — apps/api/app/
      # cv/factory.py уже выставляет их сам через os.environ.setdefault ПЕРЕД импортом
      # cv.index (ревью 04, блокер 2) — дублируем здесь явно для документации контракта и
      # чтобы offline был гарантирован ДО любого другого кода, не только cv/factory.py.
      HF_HOME: /data/models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Только для чтения: api никогда не пишет индекс сам, только читает то, что положил
      # publish-index.sh (rsync + симлинк current, см. RUNBOOK «Деплой индекса»). Пустой
      # каталог на первом запуске (до первой публикации индекса) — retriever увидит
      # пустые payloads/labels и будет честно отвечать refusal, это ожидаемо, не баг.
      - /opt/somelye/prod/rag-data/current:/data/rag:ro
      # ЧТЕНИЕ+ЗАПИСЬ (не :ro) — сюда fastembed сам качает веса моделей при первом
      # обращении (лениво, см. DenseEmbedder/CrossEncoderReranker._ensure_loaded). Именованный
      # том, а не bind-mount под rag-data: живёт своей жизнью, publish-index.sh его не трогает.
      - fastembed_cache:/data/fastembed-cache
      # --- CV: индекс (E3-do-ams3) -----------------------------------------------------
      # НЕ :ro — embedded QdrantStore(path=...) (packages/cv/cv/store.py) открывает
      # локальное хранилище в режиме чтения-записи безусловно (создаёт/трогает .lock даже
      # когда приложение только ищет, не пишет) — :ro уронил бы старт при IMAGE_PROVIDER=real.
      # Наполняется НЕ ребилдом на сервере (46 минут CPU на готовом Mac-индексе — не вариант),
      # а копией готового packages/cv/data/qdrant — способ доставки на диск конкретного хоста
      # (rsync/иначе) зависит от площадки, предмет отдельного брифа.
      - cv_index:/data/cv
      # --- CV: кэш моделей — HF (SigLIP2, HF_HOME выше) --------------------------------
      - hf_cache:/data/models
      # --- CV: ТОТ ЖЕ том hf_cache ВТОРЫМ mount'ом — кэш PaddleOCR/paddlex -------------
      # paddlex (зависимость paddleocr>=3.0) ИГНОРИРУЕТ HF_HOME и кэширует модели детекции/
      # распознавания (~100 МБ) в $HOME/.paddlex/official_models — ПРОВЕРЕНО ПО ФАКТУ,
      # reports/g-report.md: "PaddleOCR... качает модели... отдельно от HF_HOME... в
      # ~/.paddlex/official_models/". Домашний каталог пользователя контейнера "app" — /app
      # (infra/Dockerfile.api: useradd --home-dir /app). Тот же именованный volume под двумя
      # путями = один физический кэш на диске хоста: HF пишет свою поддиректорию (hub/...),
      # paddle — свою (official_models/...), имена не пересекаются. Так бриф "hf_cache — кэш
      # HF+Paddle" выполнен буквально ОДНИМ томом, а не два volume + два прогона rsync.
      - hf_cache:/app/.paddlex
      # --- CV: метаданные кейса (CASE_DATA_DIR выше) -----------------------------------
      # Маленький (~2.5 МБ: slug_refs.json+families.json, НЕ весь vines/case-data — тот 4+ ГБ
      # посторонних файлов). Добавлен сознательно, хотя изначальный список томов его не
      # называл: иначе CASE_DATA_DIR=/data/case выше указывал бы в пустоту и верификатор
      # молча деградировал бы без явной причины. Явно зафиксировано в reports/e3-do-ams3.md,
      # не тихо. Способ наполнения — тот же отдельный брифом механизм синхронизации, что и у
      # cv_index/hf_cache выше.
      - case_data:/data/case
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started   # см. заметку про healthcheck qdrant ниже — не гейтим старт api им
    # Без публикации на хост: только nginx и внутренняя сеть видят api:8000.
    expose:
      - "8000"
    # E3-do-ams3: было 2g — ГАРАНТИРОВАННЫЙ OOM с реальным CV-стеком (замер оркестратора на
    # живом стенде: RSS 3.2 ГБ в работе, пик 3.9 ГБ при сборке индекса, см. reports/
    # e3-do-ams3.md). 6g — потолок с запасом на пики (не только сборка индекса: конкурентные
    # /scan/photo, RAG-модели в том же процессе — см. «Память: как считали» ниже про RAG).
    # ВНИМАНИЕ оркестратору: это меняет расчёт RUNBOOK.md «Память: как считали» (8 ГБ на
    # ОБА контура prod+staging на одном Contabo-хосте) — см. reports/e3-do-ams3.md,
    # «Предложения», RUNBOOK.md сознательно НЕ тронут (не в списке файлов этого брифа).
    mem_limit: 6g
    mem_reservation: 3g
    cpus: 1.5
    healthcheck:
      # python есть гарантированно (это рантайм самого приложения) — не нужен ни curl, ни wget.
      # E3-do-ams3: не только HTTP 200, но и JSON-поле warm==true (apps/api/app/routers/
      # health.py — AND прогрева image_index/label_verifier, apps/api/app/cv/factory.py).
      # Прогрев НЕ роняет старт при сбое (лучше поднятый процесс с warm=false, чем совсем не
      # поднятый) — значит "процесс отвечает 200" НЕ означает "сканер готов принимать боевые
      # фото"; healthz-гейт деплоя (infra/scripts/deploy-hack-do-ams3.sh) должен видеть
      # именно это различие, не просто код ответа.
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz', timeout=3)); sys.exit(0 if d.get('warm') is True else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # E3-do-ams3: было 30s — мало для SigLIP2+PaddleOCR даже с ПРОГРЕТОГО (уже на томе)
      # дискового кэша на скромном CPU хоста; 90s — запас на медленный диск/CPU, НЕ на
      # скачивание моделей по сети (HF_HUB_OFFLINE=1 — при отсутствии кэша упадёт быстро с
      # ошибкой, не будет висеть ~340 с "холодного" сценария F2, reports/e3-do-ams3.md).
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: somelye-prod-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    # Порт на loopback (НЕ 0.0.0.0): нужен для (1) SSH-туннеля с Mac агента A при
    # `rag ingest`/`rag eval` против прод-индекса и (2) отладки curl'ом с самого хоста.
    # Наружу (интернет/Cloudflare) не публикуется никогда — только 127.0.0.1.
    ports:
      - "127.0.0.1:6333:6333"
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      # ПРИМЕЧАНИЕ: официальный образ qdrant/qdrant — debian-slim БЕЗ curl/wget.
      # bash в debian-slim есть (в отличие от alpine/busybox), поэтому TCP-проверка через
      # bash-бэктик /dev/tcp — единственный health-check без установки лишних пакетов в образ.
      # Это проверка «порт слушает», не «API отвечает 200» — слабее полноценного HTTP-чека.
      # На первом реальном деплое проверить: `docker compose exec qdrant sh -c 'command -v curl'`
      # — если появится curl в будущих версиях образа, заменить на
      #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:16-alpine
    container_name: somelye-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?нужен в .env}
      POSTGRES_USER: ${POSTGRES_USER:?нужен в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен в .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Инициализация ТОЛЬКО при первом старте (пустой data dir). Порядок важен: расширения,
      # затем контракт-схема как источник истины — файл не копируется, монтируется как есть.
      - ./postgres/init/10-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
      - ../contracts/schema.sql:/docker-entrypoint-initdb.d/20-schema.sql:ro
    # Loopback-порт для ad-hoc psql/бэкапов с хоста и туннеля с Mac, не для интернета.
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svoy_somelye} -d ${POSTGRES_DB:-svoy_somelye}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  default:
    name: somelye_prod_net

volumes:
  pg_data:
    name: somelye_prod_pg_data
  qdrant_data:
    name: somelye_prod_qdrant_data
  nginx_cache:
    name: somelye_prod_nginx_cache
  fastembed_cache:
    name: somelye_prod_fastembed_cache
  # --- CV (E3-do-ams3) — именованные тома, а не bind-mount: этот файл переиспользуется
  # разными хостами/чекаутами с разным BASE_DIR (см. заметку про /opt/somelye/prod,
  # захардкоженный в rag-data/releases выше буквально — НЕ трогаем, вне зоны этой правки,
  # см. reports/e3-do-ams3.md, «Предложения»); именованный volume работает одинаково
  # независимо от того, откуда запущен `docker compose`, обычный bind-mount так не умеет.
  cv_index:
    name: somelye_prod_cv_index
  hf_cache:
    name: somelye_prod_hf_cache
  case_data:
    name: somelye_prod_case_data
