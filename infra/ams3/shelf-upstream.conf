# Апстрим сервиса витрин apps/shelf-finder (Михаил/Potap, порт 8086 по умолчанию —
# apps/shelf-finder/docs/server-api.md, apps/shelf-finder/server/README.md).
# Ставится на сервере в /etc/nginx/conf.d/shelf-upstream.conf. bootstrap.sh кладёт эту
# ВЫКЛЮЧЕННУЮ версию, только если файла там ещё нет — как somelye.env, чтобы повторный
# bootstrap не затирал уже включённый адрес.
#
# `map`, не `set`: этот файл живёт в conf.d, а conf.d у этой коробки подключается ВНУТРИ
# http{} (nginx.conf: `include /etc/nginx/conf.d/*.conf;`), а не внутри server{} — `set`
# там не пройдёт проверку («"set" directive is not allowed here»), `map` в http{} штатно.
#
# ВЫКЛЮЧЕНО (эта версия, адрес неизвестен): $shelf_upstream пустой -> locations /v1/shelf/
# и /shelf-ui/ в nginx-somelye.conf отвечают честным 404 (return 404 до proxy_pass), а не
# try_files-фолбэком на наш SPA. Фронт держит раздел «Витрина» скрытым по живому health-чеку
# (apps/web/src/lib/shelfAvailability.ts, коммит 5af5e6d) — появится адрес здесь, раздел
# появится сам, без выката веба.
#
# ВКЛЮЧЕНИЕ — процедура, нужные от владельца сервиса данные и минимальная защита:
# infra/ams3/README.md -> «Проброс витрины Потапа», docs/architecture/operations.md §10.
# Коротко: заменить "" на "http://<host>:<port>" (или "https://…", если у сервиса TLS) БЕЗ
# хвостового "/", затем на сервере:
#   nginx -t && systemctl reload nginx
# Это требует root — вне sudo пользователя somelye/ключа ci_do_ams3 (operations.md §10.3).
#
# С 26.09 (вечер) /v1/shelf/ (кроме /v1/shelf/health) и /shelf-ui/ в nginx-somelye.conf также
# закрыты HTTP Basic-авторизацией (файл паролей /etc/nginx/.htpasswd-shelf, создаёт root) —
# не относится к этому файлу напрямую, но включается тем же root'ом в том же заходе на сервер,
# см. README «Пароль для витрины» и operations.md §10.7.
#
# Адрес — секрет транспортного уровня, тот же принцип, что VISION_LLM_URL (operations.md §5):
# менять ТОЛЬКО на сервере. Эта версия в git — всегда выключенный плейсхолдер, реальный
# адрес сюда не коммитить.
map $host $shelf_upstream {
    default "";
}
