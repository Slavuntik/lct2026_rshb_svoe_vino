# Хак-стенд «Свой Сомелье» на ams3. Порт 443 занят Reality (VPN) — стенд живёт на :80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/somelye/web;
    index index.html;

    # Фото этикеток до 25 МБ (контракт image-scan v0.4.4).
    client_max_body_size 26m;

    location /v1/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;               # SSE-стриминг ответа сомелье
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
