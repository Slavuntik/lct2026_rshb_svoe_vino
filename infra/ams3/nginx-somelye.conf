# Хак-стенд «Свой Сомелье» на ams3. Порт 443 занят Reality (VPN) — стенд живёт на :80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/somelye/web;
    index index.html;

    # Фото этикеток до 25 МБ (контракт image-scan v0.4.4).
    client_max_body_size 26m;

    location /v1/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;               # SSE-стриминг ответа сомелье
        proxy_read_timeout 300s;
    }

    # Проброс сервиса витрин apps/shelf-finder (Михаил/Potap, порт 8086) — $shelf_upstream
    # объявлен ОТДЕЛЬНЫМ файлом /etc/nginx/conf.d/shelf-upstream.conf (shelf-upstream.conf,
    # map), чтобы включение/выключение было ОДНОЙ правкой на сервере, не трогая этот файл.
    # Пустой $shelf_upstream (по умолчанию) = выключено: все три location ниже честно отвечают
    # 404, а не try_files-фолбэком на наш же SPA (200 text/html) — именно этого ждёт живой
    # health-чек фронта apps/web/src/lib/shelfAvailability.ts (коммит 5af5e6d), который прячет
    # пункт навигации «Витрина», пока /v1/shelf/health не ответит 200 application/json. `if`
    # внутри location выполняется на фазе rewrite, а auth_basic ниже — на фазе access, которая
    # у nginx ВСЕГДА идёт следующей независимо от порядка директив в файле — 404 при выключенном
    # апстриме отдаётся раньше, чем nginx успел бы спросить пароль. Процедура включения, файл
    # паролей и минимальная защита — infra/ams3/README.md, «Проброс витрины Потапа», и
    # docs/architecture/operations.md §10.
    #
    # HTTP Basic-авторизация (решение Вячеслава 26.09) — без неё через наш домен можно
    # бесплатно гонять чужой GPU Михаила. Файл паролей создаёт root на сервере командой
    # `htpasswd -B`, в репозитории его нет и быть не должно (README, «Проброс витрины Потапа»).
    #
    # Локация длиннее общего /v1/ ниже: nginx матчит САМЫЙ ДЛИННЫЙ префикс независимо от
    # порядка блоков в файле, так что /v1/shelf/* сюда, а не в apps/api, гарантированно, даже
    # если порядок блоков когда-то поменяют — но менять что-то здесь без nginx -t не стоит.

    # /v1/shelf/health — БЕЗ пароля, точный (=) матч приоритетнее префикса /v1/shelf/ ниже
    # независимо от места в файле. Фронт дергает именно этот путь без креденшелов, чтобы решить,
    # показывать ли раздел «Витрина» вообще (apps/web/src/lib/shelfAvailability.ts): под паролем
    # запрос получал бы 401 (не 200 application/json), фронт решил бы, что сервиса нет, и раздел
    # не появился бы никогда. Ничего чувствительного health не раскрывает — только { ready: bool }
    # о прогреве моделей и индекса витрины (apps/shelf-finder/docs/server-api.md, «GET
    # /v1/shelf/health»), без деталей каталога или содержимого скана.
    location = /v1/shelf/health {
        if ($shelf_upstream = "") {
            return 404;
        }
        proxy_pass $shelf_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /v1/shelf/ {
        if ($shelf_upstream = "") {
            return 404;
        }
        auth_basic "Shelf access";
        auth_basic_user_file /etc/nginx/.htpasswd-shelf;
        client_max_body_size 20m;    # лимит самого сервиса витрин (413 у него после этого)
        proxy_pass $shelf_upstream;  # без пути в variable-форме — nginx передаёт URI как есть
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;      # клиент сервиса ждёт 45с — прокси не должен резать раньше
    }

    location /shelf-ui/ {
        if ($shelf_upstream = "") {
            return 404;
        }
        # Тот же realm, что у /v1/shelf/ выше — один ввод пароля в браузере (кеш Basic-auth по
        # origin+realm) закрывает и iframe /shelf-ui/, и его же fetch-запросы к /v1/shelf/scan.
        auth_basic "Shelf access";
        auth_basic_user_file /etc/nginx/.htpasswd-shelf;
        rewrite ^/shelf-ui/(.*)$ /$1 break;  # отбрасываем префикс — интерфейс сервиса на "/"
        proxy_pass $shelf_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
