# Второй хак-стенд «Свой Сомелье» (cpulab). Нет VPN и нет заведённого TLS/домена (только
# IP) — тот же приём, что на ams3: слушаем :80, прокси на uvicorn 127.0.0.1:8000.
# Проброс витрины Потапа (apps/shelf-finder) сюда НЕ перенесён — на ams3 он тоже выключен
# (решение Вячеслава 26.09) и не входит в задание по этому стенду; понадобится — взять
# блок целиком из infra/ams3/nginx-somelye.conf + shelf-upstream.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/somelye/web;
    index index.html;

    # Фото этикеток до 25 МБ (contracts/image-scan.md v0.4.4) — тот же лимит, что на ams3.
    client_max_body_size 26m;

    # Отдельные таймауты для чата — SSE-стрим ответа сомелье, буферизация мешала бы стримингу.
    location /v1/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
