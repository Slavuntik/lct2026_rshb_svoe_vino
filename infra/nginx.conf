# infra/nginx.conf — единый конфиг для PROD и STAGING (см. оба compose.*.yml: монтируется
# как /etc/nginx/conf.d/default.conf в образ nginx:1.27-alpine, то есть ВКЛЮЧАЕТСЯ внутрь
# http{} из базового /etc/nginx/nginx.conf образа — поэтому здесь нет своих http{}/events{}
# оберток, только директивы, валидные внутри http{}.
#
# Один файл для обоих контуров — осознанно: prod и staging идентичны по конфигурации nginx,
# отличаются только тем, что к ним подключено извне (Cloudflare -> порт 443 у прод, 8443 у
# staging, см. compose.staging.yml) и каким каталогом со статикой подменяется releases/current.
# server_name оставлен catch-all (_): TLS/маршрутизация по хосту уже сделаны Cloudflare на
# границе, до конкретного контейнера долетает только предназначенный ему трафик.
#
# Зона ответственности: TLS-терминация (origin-cert Cloudflare, Full strict), статика
# apps/web (лендинг + PWA + apps/web/public/legal), reverse-proxy на api. 18+ ЗДЕСЬ НЕ
# проверяется и не должен — это ответственность клиента apps/web (agents/E-infra.md: «18+
# не решается на nginx — это клиент»). Ниже нет ни одной строчки про возраст/алкоголь-гейт.

# ---- gzip --------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml;
# Изображения/шрифты обычно уже сжаты форматом — гуглить их gzip'ом не тратим CPU.

# ---- служебное -----------------------------------------------------------------------
server_tokens off;
client_max_body_size 10m;      # /scan/ocr: фото до 8 МБ (contracts/openapi.yaml) + multipart-запас
client_body_timeout 30s;

# ---- rate limit: defense-in-depth ПОВЕРХ лимитов на уровне API (contracts/openapi.yaml,
# агент B делает свой rate limit в коде — это независимый, более грубый слой перед ним) ----
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=waitlist_zone:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Дублируется ниже в server{443} намеренно: этот (порт 80, без TLS) — то, что бьёт
    # HEALTHCHECK контейнера nginx (compose.*.yml: wget http://127.0.0.1/nginx-health);
    # версия в server{443} — то, что бьёт снаружи infra/scripts/deploy.sh (edge-проверка
    # по HTTPS после релиза). Разные потребители, оба нужны.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # Cloudflare Full(strict) обычно уже шлёт HTTPS до origin, но держим редирект и тут —
    # на случай прямых обращений мимо Cloudflare (мониторинг, будущая смена облака-картриджа).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Docker embedded DNS. КРИТИЧНО для корректных деплоев: если написать проксирование
    # как `proxy_pass http://api:8000;` (голое имя хоста), nginx резолвит "api" ОДИН РАЗ
    # при старте/reload и кэширует IP навсегда — после `docker compose up -d` с пересозданием
    # api-контейнера (infra/scripts/deploy.sh делает это на каждый релиз) у api будет НОВЫЙ
    # внутренний IP, а nginx продолжит стучаться в старый (мёртвый) до своего перезапуска.
    # Проксирование через переменную заставляет nginx резолвить заново на каждый запрос
    # (с учётом TTL resolver'а) — деплой api больше не требует ручного restart/reload nginx.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream "api:8000";

    # Cloudflare Origin CA сертификат — НЕ доверенный публичными браузерами напрямую, это
    # ожидаемо: его проверяет только цепочка Cloudflare (режим Full strict). Файлы кладутся
    # вручную на хост (RUNBOOK, раздел «Cloudflare: origin-cert»), НЕ коммитятся в репозиторий.
    ssl_certificate     /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling намеренно не включаем: Origin CA сертификат проверяется только
    # Cloudflare, а не публичными клиентами — обычной пользы от stapling здесь нет.

    # ---- security-заголовки (общие для статики и API-ответов) -----------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    # camera=(self): веб-фолбэк скана этикетки снимает камерой сам ориджин (agents/C-client.md).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    # 180 дней, БЕЗ preload: демо-контур на новых аккаунтах, preload-список практически
    # необратим на годы вперёд для домена — не решение на demo-фазу, см. RUNBOOK.
    # CSP — минимально достаточная политика под Vite-SPA, сознательно консервативно-широкая.
    # ПРОВЕРИТЬ агентам C/D после первой реальной сборки (шрифты Google Fonts, инлайн-стили
    # Vite) и ужесточить — это черновик, не финальная политика.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; object-src 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # ---- /v1/chat — SSE. Отдельно от общего proxy-блока: буферизация ДОЛЖНА быть
    # выключена, иначе клиент увидит все токены одной пачкой в конце вместо стрима. -------
    location = /v1/chat {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;                     # не сжимать event-stream
        proxy_read_timeout 120s;      # длинный чат-ответ, но не бесконечный
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- вход в API, защищённый доп. rate-limit'ом (регистрация/логин, waitlist) --------
    location /v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/waitlist {
        limit_req zone=waitlist_zone burst=5 nodelay;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- остальной API -------------------------------------------------------------
    location /v1/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- статика apps/web (Vite build: имена файлов с хэшем -> кэшировать агрессивно) ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # apps/web/public/legal/*.html (агент D) — обычные статические страницы, без SPA-фоллбэка.
    location /legal/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }

    # SPA-роутинг: и лендинг (/), и приложение (/app) — один и тот же index.html, дальше
    # маршрутизирует React (react-router), см. agents/C-client.md. no-cache — чтобы новый
    # релиз (index.html меняется на каждый деплой, см. deploy.sh: releases/<tag>/) сразу
    # подхватывался, а не висел в браузерном кэше пользователя.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
