# Контракт API «Свой Сомелье» v0.2 — ЗАМОРОЖЕН, правки — только через architect (TEAM.md,
# зона contracts/, с 22.09; было «оркестратор» — устарело).
# Изменения v0.2 (по ревью 01): +/auth/guest, +/events, +/chat/feedback, +/analogs,
# citation получил порядковый номер n, убран budget_rub_max (цен в каталоге нет),
# введён словарь кодов ошибок.
# v0.3.3 (22.09, architect): +GET /wines/{wine_id}/pairings — гастропары к распознанному
#   вину (контракт contracts/post-scan.md v1.0, задача пост-скана 22.09). Заодно info.version
#   синхронизирован с де-факто версией: поле не менялось с 0.2.0 (commit 1fe521b, 15.09) через
#   уже свершившиеся v0.2.1/v0.2.2/v0.3/v0.3.2 (см. историю коммитов contracts/openapi.yaml) —
#   не переприсваиваю задним числом их отдельные номера, только ловлю заголовок с реальностью.
# 22.09 (architect, reports/architect-submission-audit.md): +/scan/photo, +/eval/predict,
#   +/metrics/scan, +/case-thumbs/{slug}.webp — ядро кейса (contracts/image-scan.md v0.4),
#   в бою с 16–17.09, в openapi.yaml не попадало ни разу; найдено независимым аудитом сдачи.
#   info.version НЕ бампаю (осталась 0.3.3) — это довнесение существующего поведения в
#   контракт, не новая функциональность; бамп потребовал бы синхронной правки строки
#   version= в apps/api/app/main.py (зона backend, см. reports/backend-swagger.md «Риски»)
#   — оставляю тому, кто следующим меняет реальное поведение этих путей.
# v0.3.4 (22.09, architect, задача тимлида): +POST /pairing/dish-photo, +POST /pairing/dish —
#   подбор вина к фото блюда (contracts/post-scan.md v1.1 §4, НОВАЯ функциональность, не
#   довнесение). info.version БАМПНУТ (0.3.3→0.3.4) в отличие от предыдущей записи — здесь
#   контракт идёт ВПЕРЕДИ реализации, не вдогонку; apps/api/app/main.py::API_VERSION ("0.3.3")
#   backend синхронизирует при реализации (та же оговорка, что выше, теперь в другую сторону).
# Ссылки на вино в выдаче (v0.3.4, задача тимлида 22.09): в любом списке вин — цитаты-вина
#   чата (/chat, событие citation с wine_id), аналоги (/analogs, similar/analogs в rich-скане),
#   кандидаты скана (candidates, image-scan.md v0.4.11), вина подбора к блюду
#   (/pairing/dish-photo, /pairing/dish) — клиент ведёт СНАЧАЛА на внутреннюю карточку
#   /app/wine/:wineId (frontend-маршрут, не путь этого API); внешняя ссылка на портал
#   (source_url) показывается ТОЛЬКО внутри самой карточки (GET /wines/{wine_id}.source_url,
#   WineCardContent.tsx), не как прямая ссылка из списка/цитаты. Статус на 22.09 (сверено
#   architect по коду apps/web/src, read-only): analogs и кандидаты скана УЖЕ соответствовали на
#   момент ратификации (AnalogWine/ScanCandidateWine — переход по wine_id, ScanCandidateItem.
#   source_url клиентом как прямая ссылка не использовался). Найденное отклонение — chat/
#   ChatScreen.tsx::CitationBadge (href={citation.url} напрямую для любой цитаты с wine_id) —
#   ИСПРАВЛЕНО тем же днём (`5d7772a`, `reports/frontend-dish-photo-links.md`): цитата с
#   wine_id теперь внутренняя навигация на /app/wine/:wineId; цитата ТОЛЬКО с chunk_id (статья/
#   знание, нет карточки вина) — url остаётся легальной прямой ссылкой, правило касается именно
#   wine_id-цитат. Все четыре места правилу соответствуют на 22.09.
# Ошибки везде: {"error": {"code": "<snake_case>", "message": "<человеческое, по-русски>"}}
# Словарь code (единственный источник, придумывать новые нельзя):
#   validation_error | invalid_credentials | unauthorized | age_restricted
#   | consent_required | not_found | rate_limited | unknown_event | llm_unavailable
#   | not_implemented | internal_error
# Auth: Bearer JWT. Все ответы UTF-8 JSON, кроме /chat (SSE).
openapi: 3.1.0
info:
  title: Svoy Somelye API
  version: 0.3.4
servers:
  - url: /v1
paths:
  /healthz:
    get:
      summary: Живость сервиса и версия индекса
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  index_version: { type: string, description: "DEPRECATED алиас rag_index_version (до v0.5)" }
                  rag_index_version: { type: string }
                  cv_index_version: { type: string }
                  warm: { type: boolean }

  /auth/register:
    post:
      summary: Регистрация. Гейт 18+ по birth_date — иначе 403 age_restricted
      description: >
        С гостевым Bearer-токеном в заголовке — апгрейд ТОЙ ЖЕ строки users
        (email/password/birth_date заполняются, is_guest=false): история сканов и чата
        сохраняется. Без токена — новая строка. (v0.2.1)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password, birth_date, consent_version, consent_scopes]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                birth_date: { type: string, format: date }
                consent_version: { type: string }
                consent_scopes:
                  type: array
                  items: { type: string, enum: [base, profiling, geo, marketing] }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "403": { description: age_restricted }

  /auth/guest:
    post:
      summary: Гостевой вход после 18+ интерстициала — «Попробовать в браузере» без стены регистрации
      description: >
        Выдаёт анонимный JWT (subject — новый uuid без email). Гость может scan/chat/wines/analogs;
        swipes и профиль требуют полноценной регистрации (403 consent_required со scope profiling).
        Согласие base пишется в consent-ledger против анонимного id.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [age_confirmed, consent_version]
              properties:
                age_confirmed: { type: boolean, description: явное подтверждение 18+; false => 403 age_restricted }
                consent_version: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }

  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }

  /consents:
    get:
      summary: Актуальные согласия пользователя (версии, скоупы, отметки времени)
      responses: { "200": { description: ok } }
    post:
      summary: Выдать/отозвать скоупы. Отзыв base = запрос на удаление аккаунта
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [consent_version, grant, scopes]
              properties:
                consent_version: { type: string }
                grant: { type: boolean }
                scopes:
                  type: array
                  items: { type: string, enum: [base, profiling, geo, marketing] }
                  # v0.3: enum обязателен к валидации — неизвестный скоуп => 400
                  # validation_error, в ledger попадают только словарные значения
      responses:
        "204": { description: записано в consent-ledger }
        "400": { description: validation_error — скоуп вне словаря }

  /scan/resolve:
    post:
      summary: Текст с этикетки (OCR на устройстве) -> кандидаты из каталога
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000, description: сырой распознанный текст }
                hints:
                  type: object
                  properties:
                    color: { type: string }
                    winery: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [wine_id, name, winery_name, confidence]
                      properties:
                        wine_id: { type: string, description: slug из каталога vines }
                        name: { type: string }
                        winery_name: { type: string }
                        confidence: { type: number, minimum: 0, maximum: 1 }
                  low_confidence:
                    type: boolean
                    description: true => клиент показывает выбор из matches, не автопереход
                  analogs:
                    type: array
                    maxItems: 12
                    description: >
                      Фолбэк при пустых matches (B7, 17.09): из текста запроса извлечён
                      сорт/стиль (pipeline/ref: grape_synonyms + reference_styles) →
                      российские аналоги тем же резолвером, что /analogs. Форма items —
                      как у wines в ответе /analogs. Иностранное вино вне каталога →
                      «вот российский аналог».
                    items: { type: object }
                  analog_reason:
                    type: string
                    nullable: true
                    description: человекочитаемое объяснение фолбэка («Urban Riesling вне каталога — аналоги по стилю рислинг»)

  /scan/photo:
    post:
      summary: >
        Фото этикетки -> одна карточка вина (кейс ЛЦТ) — flat для скрипта оценки, rich для UI;
        contracts/image-scan.md «Режимы ответа API» (добавлено в openapi.yaml задним числом
        при аудите reports/architect-submission-audit.md, 22.09 — эндпоинт в бою с v0.4)
      description: >
        multipart image (до 25 МБ; decode применяет EXIF Orientation, принимает HEIC).
        ?flat=1 => flat-режим скрипта оценки: ответ РОВНО {"slug": "..."}, всегда лучший
        доступный slug, несгораемый (любая ошибка -> валидный JSON, не 500), без auth.
        Без flat (или flat=0) => rich-режим для UI. Дефолт при отсутствии query-параметра —
        env SCAN_FLAT_DEFAULT. Auth (уточнено v0.3.4, сверено architect по коду
        routers/scan.py, 22.09): ОПЦИОНАЛЬНЫЙ Bearer в ОБОИХ режимах (не только flat) —
        `get_current_principal_optional`, сознательное отступление от общего правила
        "scan/chat/wines/analogs требуют принципала" (нужно скрипту оценки без токена);
        токен, если есть, только атрибутирует запись.
      parameters:
        - name: flat
          in: query
          required: false
          schema: { type: boolean }
          description: "1 => flat-режим скрипта оценки (см. выше)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: flat-режим принимает первое файловое поле multipart независимо от имени
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScanPhotoFlatResponse"
                  - $ref: "#/components/schemas/ScanPhotoRichResponse"
                description: выбор формы ответа — по параметру flat, не по content negotiation

  /eval/predict:
    post:
      summary: >
        Алиас flat-режима /scan/photo для скрипта оценки кейсодержателя — v0.4.6
      description: >
        Фиксированный путь их participant_test.sh (дефолтный endpoint в скрипте —
        http://127.0.0.1:8080/v1/eval/predict, curl --max-time 10 c). Тот же обработчик, что
        /scan/photo?flat=1: без auth, несгораемый, HTTP 200 + {"slug": "..."} даже при низкой
        уверенности или сбое пайплайна. SLA кейса — мягкая цель ≤3 c (case.md), жёсткий лимит
        скрипта — 10 c.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanPhotoFlatResponse" }

  /metrics/scan:
    get:
      summary: F1 топ-1/топ-5, доля совпадений и версия индекса последнего eval-прогона
      description: >
        Пункт ТЗ «метрика уверенности (F1) для топ-1 и топ-5, видна в API» (case.md,
        функция 3). f1_top5 законно null, если последний записанный прогон был flat-режимом
        (считает только топ-1, см. reports/architect-submission-audit.md) — не 0, честная
        деградация, а не притворство нулевым F1.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanMetricsResponse" }

  /case-thumbs/{slug}.webp:
    get:
      summary: Превью эталона каталога кейса — только для карточки-фолбэка (v0.4.11 п.4)
      description: >
        CASE_DATA_DIR/thumbs/<slug>.webp — материалы каталога кейса, использование
        ограничено демо (разрешение организаторов, contracts/image-scan.md v0.4.11 п.4).
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: "not_found — слага нет в CASE_DATA_DIR/thumbs/" }

  /scan/ocr:
    post:
      summary: Веб-фолбэк — фото на сервер, только по явному согласию в этом запросе
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, explicit_consent]
              properties:
                image: { type: string, format: binary, description: до 8 МБ }
                explicit_consent: { type: boolean }
      responses:
        "501":
          description: >
            not_implemented — серверный OCR сознательно отложен за MVP (решение ревью 01).
            Клиент обязан обработать 501 честной деградацией: предложить ввод текста с
            этикетки. v0.3: контракт приведён к реальности — раньше здесь обещался 200.

  /wines/{wine_id}:
    get:
      summary: Карточка вина — source-поля + derived + ссылка на первоисточник
      parameters:
        - { name: wine_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [wine_id, source, derived, source_url]
                properties:
                  wine_id: { type: string }
                  source: { type: object, description: как в catalog/wines/<slug>.json }
                  derived: { type: object }
                  source_url: { type: string, format: uri }
                  similar: { type: array, items: { type: string } }

  /wines/{wine_id}/pairings:
    get:
      summary: >
        Гастропары «к чему подать это вино» — v0.3.3 (22.09, contracts/post-scan.md v1.0)
      description: >
        Резолвит wine_id тем же путём, что GET /wines/{wine_id} (наш каталог, затем каталог
        кейса) — 404 not_found на тех же условиях. Три уровня данных по убыванию точности:
        catalog (source.food_pairings как есть, score=null), sensory (derived.sensory —
        реальный вектор через pipeline/ref/food_pairing_rules.yaml), heuristic (нет ни того,
        ни другого — обычный случай для каталога кейса при сканировании: вектор строится из
        color + ключевых слов сахара/игристости в name/description, таблица дефолтов в
        contracts/post-scan.md §1). basis=unavailable, когда даже color пуст. pairings — не
        более output_contract.top_n=3 (food_pairing_rules.yaml, число не меняем); message
        непусто ⟺ pairings=[] (честное «нет данных», не ошибка).
      parameters:
        - { name: wine_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [wine_id, basis, pairings]
                properties:
                  wine_id: { type: string }
                  basis: { type: string, enum: [catalog, sensory, heuristic, unavailable] }
                  pairings:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [tag]
                      properties:
                        tag:
                          type: string
                          description: >
                            При basis=catalog — строка как в source.food_pairings (словарь
                            портала, свободный). При sensory/heuristic — один из 9 тегов
                            pipeline/ref/food_pairing_rules.yaml::portal_tag_defaults.
                        score: { type: number, minimum: 0, maximum: 1, nullable: true, description: "null при basis=catalog" }
                        triggered_rules:
                          type: array
                          description: "[] при basis=catalog"
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              explain: { type: string, description: "дословно rules[].explain из food_pairing_rules.yaml" }
                  message:
                    type: string
                    nullable: true
                    description: непусто, когда pairings=[] (basis=unavailable либо ни одно правило не сработало)
        "404": { description: "not_found — wine_id не резолвится ни нашим каталогом, ни каталогом кейса (как GET /wines/<wine_id>)" }

  /pairing/dish-photo:
    post:
      summary: >
        Фото блюда -> распознавание + подбор вина — v0.3.4 (22.09, contracts/post-scan.md
        v1.1 §4, задача тимлида)
      description: >
        multipart image; лимиты и авторизация — КАК У /scan/photo (до 25 МБ = settings.
        max_upload_bytes, EXIF/HEIC, опциональный принципал — не обязательный Bearer, тот же
        get_current_principal_optional). Пустой/отсутствующий файл или файл больше лимита —
        400 validation_error. Фото НЕ пишется в архив сканов (SCAN_ARCHIVE_DIR) — другая
        категория данных. Классификация — VLM-шлюз И локальная модель на Mac (vlm_local)
        запрашиваются ПАРАЛЛЕЛЬНО (если обе настроены и предохранитель разрешает), общий
        дедлайн VISION_LLM_TIMEOUT_S (дефолт 6.0 с) от начала запроса; результат шлюза
        побеждает, если успел, иначе — локальный (не склейка текстов, в отличие от скана).
        Предохранитель — тот же, что у скана, общее состояние на "vlm"/"vlm_local", не по
        эндпоинту. Ни одна модель не ответила -> zero_shot: CLIP-подобная классификация
        текстовой башней того же SigLIP2-энкодера, что индекс сканера, против якорей (9
        тегов + "бутылка вина" + "не еда"); порог уверенности — отрыв top1/top2 эмбеддинга
        ≥ DISH_ZERO_SHOT_MARGIN (дефолт 0.03), иначе воздержание. Ни одна ступень не дала
        ответа -> status=unsure. Как у rich-режима /scan/photo: битый запрос — обычная
        валидация (4xx); сбой внутри классификации — никогда 500, деградация по цепочке до
        status=unsure. Полная спецификация статусов/полей — post-scan.md §4.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DishPairingResponse" }

  /pairing/dish:
    post:
      summary: >
        Ручной выбор/исправление категории блюда -> подбор вина — v0.3.4 (22.09,
        contracts/post-scan.md v1.1 §4)
      description: >
        Без фото — пользователь (чип из alternatives, или свободный ввод) явно называет
        category. Тот же ответ, что /pairing/dish-photo: status всегда "food", dish.
        source="user", подбор вин — идентичный алгоритм (post-scan.md §4.3). Auth —
        ОБЯЗАТЕЛЬНЫЙ Bearer (get_current_principal, отличие от /pairing/dish-photo: не
        принимает приватная проверка кейсодержателя, применено общее правило "scan/chat/
        wines/analogs требуют принципала", app/security.py). Разрешение category —
        точное совпадение (без учёта регистра) -> словарь частых синонимов ("стейк"->BBQ и
        т.п.) -> нечёткое совпадение (rapidfuzz token_set_ratio, порог 60) -> 400
        validation_error, если ничего не подошло.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category:
                  type: string
                  maxLength: 100
                  description: строго один из 9 тегов pipeline/ref/food_pairing_rules.yaml::portal_tag_defaults, либо распознаваемый синоним/опечатка (см. выше) — иное -> 400 validation_error
                dish:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: свободный текст названия блюда, опционально; не разбирается на ингредиенты (v1)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DishPairingResponse" }
        "400": { description: "validation_error — category вне 9 легальных тегов" }

  /chat:
    post:
      summary: Вопрос сомелье. Ответ — SSE-стрим
      description: >
        События: {"type":"token","text":"..."} |
        {"type":"citation","n":1,"wine_id"|"chunk_id":"...","url":"...","quote":"..."} |
        {"type":"done","answer_id":"..."} | {"type":"refusal","reason":"..."}.
        n — порядковый номер цитаты, совпадает с маркерами [n] в тексте ответа: клиент
        сопоставляет их однозначно. Каждый фактический ответ обязан нести >=1 citation;
        пустая выдача ретривера => refusal с честным текстом.
        v0.3: стриминг НАСТОЯЩИЙ — token-события уходят по мере генерации LLM
        (chat_stream драйвера), буферизация полного ответа запрещена: молчание 5-10 с
        на сцене демо — это провал сцены.
        v0.3.2: следствие настоящего стриминга — показанные токены не отозвать, поэтому
        если генерация завершилась БЕЗ единого citation-события (модель не расставила [n]),
        сервер обязан перед done отправить citation-события для выдержек, использованных
        в промпте (нумерация n продолжается, соответствия маркерам в тексте нет). Клиент
        рендерит такие непривязанные цитаты блоком «Источники» под ответом. Гарантия
        «каждый ответ несёт источники» сохраняется по построению: контекст промпта и есть
        источник ответа.
        v0.3.4 (22.09, "Ссылки на вино в выдаче", см. шапку файла): citation с wine_id — клиент
        ведёт на /app/wine/:wineId, а не открывает url напрямую (url — для карточки, не для
        цитаты); citation только с chunk_id (нет карточки вина) — url остаётся прямой ссылкой,
        это единственный легальный случай. Реализовано тем же днём (apps/web/src/app/chat/
        ChatScreen.tsx::CitationBadge, `5d7772a`) — правку нашёл architect, исправил frontend.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 1000 }
                filters:
                  type: object
                  properties:
                    color: { type: string }
                    sugar: { type: string }
                    region: { type: string }
                  # budget убран в v0.2: цен в каталоге нет вовсе (ревью 01, блокер 4)
      responses:
        "200": { description: text/event-stream }

  /chat/feedback:
    post:
      summary: 👍/👎 на ответ сомелье — пополняет голд-сет
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [answer_id, verdict]
              properties:
                answer_id: { type: string, description: из SSE-события done }
                verdict: { type: string, enum: [up, down] }
      responses: { "204": { description: ok } }

  /analogs:
    post:
      summary: Сцена «аналог импортного» — детерминированный путь, не через LLM
      description: >
        Текст пользователя («люблю Просекко», «что-то вроде Шабли») резолвится в эталонный
        стиль (rag.resolve_style по названиям/синонимам reference_styles), затем
        rag.analog_for_style возвращает российские вина с этим стилем в derived.
        Нерезолвящийся текст => 404 not_found с подсказкой популярных стилей.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 200 }
                filters:
                  type: object
                  properties:
                    region: { type: string }
                    sugar: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [style, wines]
                properties:
                  style:
                    type: object
                    properties:
                      slug: { type: string }
                      name: { type: string }
                      country: { type: string }
                  wines:
                    type: array
                    maxItems: 12
                    items:
                      type: object
                      properties:
                        wine_id: { type: string }
                        name: { type: string }
                        winery_name: { type: string }
                        region_name: { type: string }
        "404": { description: not_found — стиль не распознан, в message топ-5 поддерживаемых }

  /events:
    post:
      summary: Продуктовые события клиента — только имена из contracts/events.md
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, props]
              properties:
                name: { type: string }
                props: { type: object }
      responses:
        "204": { description: записано }
        "400": { description: unknown_event — имени нет в словаре }

  /taste/swipes:
    post:
      summary: Свайп-дегустация. Требует scope profiling
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [wine_id, verdict]
              properties:
                wine_id: { type: string }
                verdict: { type: string, enum: [like, dislike, skip] }
      responses: { "204": { description: ok } }

  /taste/profile:
    get:
      summary: Вкусовой паспорт — вектор в 7 осях + топ эталонных стилей
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  vector:
                    type: object
                    description: sweetness/acidity/tannin/body/oak/aromatic_intensity/bubbles, 0..1
                  top_styles: { type: array, items: { type: string } }
                  swipes_count: { type: integer }

  /taste/candidates:
    get:
      summary: Колода для свайп-дегустации
      description: >
        Вина для экрана «паспорт вкуса»: разнообразие по цвету/региону/стилю, исключая уже
        свайпнутые пользователем. Гостю — 403 consent_required (scope profiling).
        Добавлено v0.2.2: пробел нашёл агент C — колода была захардкожена, источника в API не было.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [wines]
                properties:
                  wines:
                    type: array
                    items:
                      type: object
                      required: [wine_id, name, winery_name]
                      properties:
                        wine_id: { type: string }
                        name: { type: string }
                        winery_name: { type: string }
                        region_name: { type: string }
                        color: { type: string }
                        image_url: { type: string }

  /waitlist:
    post:
      summary: Лендинг. Без auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, consent_version]
              properties:
                email: { type: string, format: email }
                consent_version: { type: string }
      responses: { "204": { description: ok } }

  /profile/data-export:
    get:
      summary: Выгрузка всех данных пользователя (право субъекта ПД)
      responses: { "200": { description: application/json, полный дамп } }

  /profile:
    delete:
      summary: Удаление аккаунта и данных; consent-ledger хранит факт отзыва
      responses: { "204": { description: удалено } }

components:
  schemas:
    TokenPair:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }

    # --- Кейс ЛЦТ: сканер по фото (apps/api/app/schemas.py, contracts/image-scan.md) ---
    # Добавлено в openapi.yaml задним числом при аудите
    # reports/architect-submission-audit.md (22.09) — код и image-scan.md были источником
    # истины с v0.4, эта схема впервые сводит их с формальным контрактом API.

    ScanPhotoFlatResponse:
      type: object
      required: [slug]
      properties:
        slug: { type: string }

    ScanConfidence:
      type: object
      properties:
        top1_score: { type: number, minimum: 0, maximum: 1, nullable: true }
        gap:
          type: number
          nullable: true
          description: отрыв top1 от первого кандидата чужой near-dup семьи; null = доминирование (см. v0.4.7)
        f1_top1: { type: number, minimum: 0, maximum: 1, nullable: true }
        f1_top5: { type: number, minimum: 0, maximum: 1, nullable: true }
        eval_missing:
          type: boolean
          default: false
          description: true, пока нет eval-отчёта — f1_* тогда null, а не притворный 0

    PhotoMatchItem:
      type: object
      required: [slug, score]
      description: >
        v0.4.3 — сырая ANN-позиция (не карточка) исключительно для eval-раннера: без этого
        поля F1-top5 через живой API вырождается в F1-top1.
      properties:
        slug: { type: string }
        score: { type: number }

    ScanCandidateItem:
      type: object
      required: [wine_id, name, source_url, score]
      description: >
        v0.4.11 — top-5 схлопнутых позиций при неуверенности («возможно, это одно из»),
        обогащённых карточкой; из нашего каталога либо (фолбэк) из каталога кейса.
      properties:
        wine_id: { type: string }
        name: { type: string }
        winery_name: { type: string, nullable: true }
        region_name: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        source_url: { type: string, format: uri }
        score: { type: number }

    ScanPhotoRichResponse:
      type: object
      required: [confidence, ocr_verified, timing_ms, not_in_catalog]
      properties:
        slug: { type: string, nullable: true }
        card:
          type: object
          nullable: true
          description: ровно тело GET /wines/{wine_id} (v0.4.1) — своя форма у карточки скана отсутствует
        confidence: { $ref: "#/components/schemas/ScanConfidence" }
        ocr_verified: { type: boolean }
        timing_ms: { type: integer }
        not_in_catalog: { type: boolean }
        similar:
          type: array
          items: { type: object }
          description: форма items — как у wines в ответе /analogs
        analogs:
          type: array
          items: { type: object }
          description: форма items — как у wines в ответе /analogs
        matches:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/PhotoMatchItem" }
          description: top-5 схлопнутых позиций по убыванию; UI НЕ рендерит (одна карточка — закон)
        candidates:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ScanCandidateItem" }
          description: поле есть всегда; UI показывает при not_in_catalog=true

    ScanMetricsResponse:
      type: object
      description: GET /metrics/scan — снимок последнего eval-прогона (CV_EVAL_REPORT_PATH)
      properties:
        index_version: { type: string, nullable: true }
        f1_top1: { type: number, minimum: 0, maximum: 1, nullable: true }
        f1_top5: { type: number, minimum: 0, maximum: 1, nullable: true }
        match_rate: { type: number, minimum: 0, maximum: 1, nullable: true }
        eval_set: { type: string, nullable: true, description: человекочитаемое описание прогона }
        measured_at: { type: string, format: date-time, nullable: true }

    DishInfo:
      type: object
      description: v0.3.4 (post-scan.md §4) — блюдо, распознанное на фото либо названное пользователем
      required: [name, category, alternatives, ingredients, source]
      properties:
        name: { type: string, description: "НЕ null — пустая строка при отсутствии значения (not_food/bottle/unsure/zero_shot); реализация backend (22.09) держит поле ненуллабельным" }
        category:
          type: string
          nullable: true
          description: один из 9 тегов pipeline/ref/food_pairing_rules.yaml::portal_tag_defaults; null, если status != food
        alternatives:
          type: array
          items: { type: string }
          description: >
            0-2 тега из тех же 9 (без повтора category) при status=food и слабой уверенности
            модели; ВСЕ 9 тегов, когда category не резолвлен (status=unsure или модель дала тег
            вне словаря) — API сам отдаёт полный список чипов, фронт его не хардкодит повторно.
        ingredients:
          type: array
          items: { type: string }
          description: "до 5 позиций у source=vlm|vlm_local; всегда [] у source=zero_shot|user|none (ни энкодер, ни свободный текст пользователя не разбираются на состав)"
        source: { type: string, enum: [vlm, vlm_local, zero_shot, user, none] }

    PairingWineItem:
      type: object
      description: >
        v0.3.4 (post-scan.md §4.3) — вино-рекомендация к блюду, только наш каталог (не каталог
        кейса). Намеренно БЕЗ source_url — переход на /app/wine/:wineId, внешняя ссылка только
        из карточки (см. "Ссылки на вино в выдаче" в шапке файла).
      required: [wine_id, name, reason, basis]
      properties:
        wine_id: { type: string }
        name: { type: string }
        winery: { type: string, nullable: true, description: "отображаемое имя винодельни (source.winery_name, фолбэк — слаг source.winery); null, если у вина нет ни того ни другого. Группировка ≤2/винодельня в §4.3 идёт по слагу source.winery (фолбэк — winery_name, затем wine_id), не по этому полю" }
        color: { type: string, nullable: true, description: "source.color; null у вин без простановки" }
        sugar: { type: string, nullable: true, description: "source.sugar_category; null (не пустая строка) у вин без простановки" }
        image_url: { type: string, nullable: true }
        reason:
          type: string
          description: >
            Детерминированная строка без LLM: basis=catalog — фиксированный шаблон;
            basis=rules — explain первого сработавшего правила food_pairing_rules.yaml,
            дословно (тот же принцип, что triggered_rules в /wines/{wine_id}/pairings).
        basis: { type: string, enum: [catalog, rules] }

    DishPairingResponse:
      type: object
      description: >
        v0.3.4 (post-scan.md §4) — общий ответ /pairing/dish-photo и /pairing/dish.
      required: [status, dish, wines, timing_ms]
      properties:
        status: { type: string, enum: [food, not_food, bottle, unsure] }
        dish: { $ref: "#/components/schemas/DishInfo" }
        wines:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/PairingWineItem" }
          description: "не более 2 вин на одну винодельню (source.winery); [] ⟺ message непусто"
        message:
          type: string
          nullable: true
          description: непусто при status != food, либо когда подбор §4.3 не нашёл ни одного вина
        timing_ms: { type: integer, description: "весь путь ручки (классификация, если была, + подбор вин)" }
