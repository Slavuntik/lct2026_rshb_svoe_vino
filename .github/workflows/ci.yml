name: CI

# Монорепо строится параллельно несколькими агентами (см. ../../ORCHESTRATION.md) — на
# момент написания этого workflow apps/api, apps/web и packages/rag ещё пустые каталоги.
# Job `detect` смотрит, какие зоны уже реально содержат проект, и остальные jobs включаются
# только для готовых зон — чтобы чужой ещё не начатый участок не красил CI всем подряд.
# Как только зона появляется (commit с pyproject.toml/package.json), её job включается сам,
# без правок этого файла.

on:
  pull_request:
  push:
    branches: [main]
  # agents/E2-cicd.md, п.1: разрешает deploy-hack-yc.yml/deploy-biz.yml переиспользовать
  # ровно эти тесты как гейт перед деплоем (jobs.tests: uses: ./.github/workflows/ci.yml)
  # вместо дублирования pytest/vitest шагов в каждом деплой-workflow. Поведение по
  # pull_request/push не меняется — это только доп. способ вызвать тот же набор джобов.
  workflow_call:
    inputs:
      skip_optional:
        description: "Пропустить необязательный rag-eval (деплой-гейт не ждёт скачивания моделей)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.d.outputs.api }}
      rag: ${{ steps.d.outputs.rag }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          test -f apps/api/pyproject.toml && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          test -f packages/rag/pyproject.toml && echo "rag=true" >> "$GITHUB_OUTPUT" || echo "rag=false" >> "$GITHUB_OUTPUT"
          test -f apps/web/package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  api-tests:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.5.11" }
      - name: uv sync
        working-directory: apps/api
        run: uv sync --frozen --all-extras --dev
      # pytest покрывает и сверку openapi-схемы FastAPI с contracts/openapi.yaml (DoD брифа B).
      - name: pytest (agents/B-api.md — без сети, mock LLM + mock RAG)
        working-directory: apps/api
        run: uv run pytest -q

  rag-tests:
    needs: detect
    if: needs.detect.outputs.rag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.5.11" }
      - name: uv sync
        working-directory: packages/rag
        run: uv sync --frozen --all-extras --dev
      - name: pytest (agents/A-rag.md — без сети к LLM, эмбеддинги/реранкер локальные)
        working-directory: packages/rag
        run: uv run pytest -q

  rag-eval-optional:
    needs: [detect, rag-tests]
    if: needs.detect.outputs.rag == 'true' && !inputs.skip_optional
    runs-on: ubuntu-latest
    # ОПЦИОНАЛЬНО по брифу agents/E-infra.md: скачивание bge-m3/bge-reranker-v2-m3 в CI-раннере
    # может не влезть по времени/диску или упереться в недоступность HuggingFace из раннера.
    # continue-on-error, чтобы это не блокировало PR — см. reports/e-report.md, «Допущения».
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.5.11" }
      - name: uv sync
        working-directory: packages/rag
        run: uv sync --frozen --all-extras --dev
      - name: rag eval на голд-сете (contracts/rag-interface.md)
        working-directory: packages/rag
        run: uv run rag eval --goldset eval/goldset.jsonl

  web-tests:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      # apps/web/package.json: "test": "vitest run" — уже без watch-режима, доп. флаги не нужны.
      - run: npm run test
        working-directory: apps/web

  ci-summary:
    needs: [detect, api-tests, rag-tests, web-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Итог
        run: |
          echo "api: ${{ needs.detect.outputs.api }} -> ${{ needs.api-tests.result }}"
          echo "rag: ${{ needs.detect.outputs.rag }} -> ${{ needs.rag-tests.result }}"
          echo "web: ${{ needs.detect.outputs.web }} -> ${{ needs.web-tests.result }}"
          # Проваленный job для готовой зоны красит весь CI; job для ещё не начатой зоны
          # (skipped, т.к. detect.outputs.* == 'false') считается успехом, не блокирует.
          for pair in "${{ needs.detect.outputs.api }}:${{ needs.api-tests.result }}" \
                      "${{ needs.detect.outputs.rag }}:${{ needs.rag-tests.result }}" \
                      "${{ needs.detect.outputs.web }}:${{ needs.web-tests.result }}"; do
            ready="${pair%%:*}"; result="${pair##*:}"
            if [[ "$ready" == "true" && "$result" != "success" ]]; then
              echo "::error::зона готова, но её job завершился как ${result}"
              exit 1
            fi
          done
