name: Shelf finder
on:
  push:
    branches: [main]
    paths: ['apps/shelf-finder/**', '.github/workflows/shelf-finder.yml']
  pull_request:
    paths: ['apps/shelf-finder/**', '.github/workflows/shelf-finder.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shelf-finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/shelf-finder/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
