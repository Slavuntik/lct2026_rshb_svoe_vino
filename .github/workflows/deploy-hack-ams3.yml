name: Deploy native stands (ams3 + YC)

# Хак-стенд сканера на exit-ams3 (боевой VPN-бокс, поэтому без Docker — нативный systemd).
# Релиз: main после тестов, тег hack-v* или ручной запуск. Код и сборка веба едут rsync'ом по SSH от пользователя
# somelye (без sudo, кроме рестарта своего сервиса); данные и модели сюда не входят —
# их доставляет infra/ams3/sync-data.sh. Процедура с нуля — infra/ams3/README.md.
#
# Секреты репозитория: AMS3_HOST, AMS3_SSH_KEY (приватный ключ CI), AMS3_KNOWN_HOSTS;
# необязательный GIGACHAT_AUTH_KEY — ключ российской LLM для «Сомелье».
# необязательные VISION_LLM_URL + VISION_LLM_KEY — шлюз VLM (наш GPU-сервер) для чтения этикетки.

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Пропустить тесты (аварийный выкат)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["hack-v*"]

concurrency:
  group: deploy-hack-ams3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.AMS3_HOST }}
          KEY: ${{ secrets.AMS3_SSH_KEY }}
          KNOWN: ${{ secrets.AMS3_KNOWN_HOSTS }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ] && [ -n "$KNOWN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Секреты AMS3_HOST / AMS3_SSH_KEY / AMS3_KNOWN_HOSTS не заданы — деплой невозможен"
            exit 1
          fi

  tests:
    needs: guard
    if: needs.guard.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    uses: ./.github/workflows/ci.yml
    with:
      skip_optional: true

  deploy:
    strategy:
      fail-fast: false
      matrix:
        target: [ams3, yc]
    needs: [guard, tests]
    if: always() && needs.guard.outputs.ready == 'true' && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_tests))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: SSH-ключ CI
        env:
          KEY: ${{ secrets.AMS3_SSH_KEY }}
          KNOWN: ${{ secrets.AMS3_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ams3_ci && chmod 600 ~/.ssh/ams3_ci
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          cat infra/native/yc_known_hosts >> ~/.ssh/known_hosts

      - name: Выкат и healthz-гейт
        env:
          HOST: ${{ matrix.target == 'ams3' && secrets.AMS3_HOST || '84.201.163.74' }}
          # Existing per-host environment and LLM secrets are preserved.
        run: bash infra/ams3/push-release.sh "$HOST" ~/.ssh/ams3_ci
