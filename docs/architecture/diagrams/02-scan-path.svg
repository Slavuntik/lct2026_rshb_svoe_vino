ize="13" fill="currentColor" opacity="0.72">уверенность, лучший из двух</text><line x1="167" y1="598" x2="167" y2="656" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24" y="656" width="286" height="64" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="167.0" y="682.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Плоский ответ для скрипта</text><text x="167.0" y="704.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">{"slug": "..."}</text><rect x="350" y="656" width="286" height="64" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="493.0" y="682.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Карточка для приложения</text><text x="493.0" y="704.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">вино, кандидаты, уверенность</text><line x1="292" y1="562" x2="493" y2="656" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="676" y="672" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#A63A52" opacity="1">медиана 4,7 с · худший 6,5 с · лимит 10 с</text><text x="676" y="696" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">ни один ответ не превысил лимит ни на одной волне</text></svg>
