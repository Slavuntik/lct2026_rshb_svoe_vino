ans', system-ui, sans-serif" font-size="12" letter-spacing="1.2" fill="currentColor" opacity="0.6">ЗРЕНИЕ</text><rect x="484" y="78" width="250" height="72" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="609.0" y="108.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">SigLIP2 base-384</text><text x="609.0" y="130.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">мультикроп: кадр и этикетка</text><line x1="734" y1="114" x2="792" y2="114" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="792" y="78" width="250" height="72" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="917.0" y="108.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Поиск по индексу</text><text x="917.0" y="130.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">ближайшие эталоны, top-k</text><text x="484" y="176" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.7">≈0,9 с на четырёх ядрах</text><rect x="452" y="250" width="724" height="200" rx="12" stroke="currentColor" stroke-width="1" stroke-dasharray="4 5" fill="none" opacity="0.45"/><text x="466" y="270" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" letter-spacing="1.2" fill="currentColor" opacity="0.6">ТЕКСТ ЭТИКЕТКИ</text><rect x="484" y="288" width="250" height="64" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="609.0" y="314.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">RapidOCR</text><text x="609.0" y="336.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">масштабы 640 и 960 + кроп 1280</text><rect x="484" y="368" width="250" height="64" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="609.0" y="394.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Модель 27B через шлюз</text><text x="609.0" y="416.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">и локальная 4B на Mac</text><line x1="734" y1="320" x2="792" y2="336" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="734" y1="400" x2="792" y2="368" stroke="#A63A52" stroke-width="1.6" marker-end="url(#arrow-acc)"/><rect x="792" y="304" width="250" height="96" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="917.0" y="346.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Поиск текста по каталогу</text><text x="917.0" y="368.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">гомоглифы, IDF, нечёткость</text><text x="484" y="470" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.7">OCR 1,5–3 с · модель 2–6 с, дальше не ждём</text><line x1="422" y1="336" x2="484" y2="114" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430" y="217.0" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">кадр</text><line x1="422" y1="336" x2="484" y2="320" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="453.0" y="320.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">кадр</text><line x1="4