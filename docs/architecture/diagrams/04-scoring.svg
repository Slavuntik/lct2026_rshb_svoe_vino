<?xml version="1.0" encoding="UTF-8"?>
<svg color="#241118" viewBox="0 0 1200 640" role="img" aria-label="Как из сходства картинки и текста получается один ответ" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A52"/></marker></defs><rect x="40" y="56" width="330" height="88" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="205.0" y="94.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Визуальное сходство cv</text><text x="205.0" y="116.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">косинус SigLIP2 по лучшему кропу</text><rect x="40" y="176" width="330" height="88" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="205.0" y="214.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Текстовая релевантность rel</text><text x="205.0" y="236.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">совпадение чтения со всем каталогом</text><rect x="40" y="296" width="330" height="128" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="56" y="322" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Что делает текст сопоставимым</text><text x="56" y="346" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">латиница и греческие буквы → кириллица</text><text x="56" y="366" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">вес редких слов (IDF), нечёткое сравнение</text><text x="56" y="386" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">поля: название, винодельня, сорт, сахар</text><line x1="370" y1="100" x2="452" y2="140" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="370" y1="220" x2="452" y2="160" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="452" y="112" width="300" height="96" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="602.0" y="154.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Итоговый скор</text><text x="602.0" y="176.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">final = cv + 0,3 × rel</text><line x1="602" y1="208" x2="602" y2="268" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="452" y="268" width="300" height="156" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="468" y="294" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Поправки</text><text x="468" y="318" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">винодельня не подтверждена → ×0,5</text><text x="468" y="338" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">цвет противоречит чтению → −0,05</text><text x="468" y="358" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">нет эталона у слага → cv лучшего −0,03</text><line x1="752" y1="160" x2="834" y2="160" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="834" y="112" width="326" height="96" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="997.0" y="154.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Два ответа</text><text x="997.0" y="176.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">локальный и с моделью</text><line x1="997" y1="208" x2="997" y2="268" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="834" y="268" width="326" height="96" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="997.0" y="310.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Правило выбора</text><text x="997.0" y="332.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">модель, если уверена, иначе локальный</text><text x="834" y="392" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">проверено на 62 фото и на подмене чтений:</text><text x="834" y="412" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">не хуже склейки на чистых данных,</text><text x="834" y="432" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">устойчивее к уверенной ошибке модели</text><text x="40" y="496" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="16" fill="currentColor" opacity="1">Гейт уверенности решает, что увидит пользователь</text><rect x="40" y="520" width="340" height="84" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="210.0" y="556.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Уверены</text><text x="210.0" y="578.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">отрыв от семьи ≥ 0,03 и cv ≥ 0,80</text><rect x="412" y="520" width="340" height="84" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="582.0" y="556.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Сомневаемся</text><text x="582.0" y="578.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">показываем до пяти кандидатов</text><rect x="784" y="520" width="376" height="84" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="972.0" y="556.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Не наш каталог</text><text x="972.0" y="578.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">честное «нет» и похожие по стилю</text></svg>
