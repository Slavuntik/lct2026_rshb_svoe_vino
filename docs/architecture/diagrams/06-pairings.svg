<?xml version="1.0" encoding="UTF-8"?>
<svg color="#241118" viewBox="0 0 1200 560" role="img" aria-label="Две цепочки гастропар: от вина к блюду и от фотографии блюда к винам каталога" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A52"/></marker></defs><text x="40" y="44" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="16" fill="currentColor" opacity="1">Вино → блюдо: что подать к этой бутылке</text><rect x="40" y="64" width="250" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="165.0" y="96.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Карточка вина</text><text x="165.0" y="118.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">после скана или из каталога</text><line x1="290" y1="102" x2="348" y2="102" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="348" y="64" width="250" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="473.0" y="96.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Теги портала</text><text x="473.0" y="118.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">если они есть у вина</text><line x1="598" y1="102" x2="656" y2="102" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="627.0" y="94.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">нет</text><rect x="656" y="64" width="250" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="781.0" y="96.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Правила по сенсорике</text><text x="781.0" y="118.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">кислотность, танин, тело</text><line x1="906" y1="102" x2="964" y2="102" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="94.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">нет</text><rect x="964" y="64" width="196" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="1062.0" y="96.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Оценка по цвету</text><text x="1062.0" y="118.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">и сахару</text><text x="40" y="168" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">первый пригодный уровень и используется; данных нет вовсе — говорим об этом прямо</text><text x="40" y="244" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="16" fill="currentColor" opacity="1">Блюдо → вино: что налить к этой тарелке</text><rect x="40" y="264" width="250" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="165.0" y="296.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Фото блюда</text><text x="165.0" y="318.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">камера или загрузка</text><line x1="290" y1="302" x2="348" y2="302" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="348" y="264" width="280" height="76" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="488.0" y="296.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Модель смотрит кадр</text><text x="488.0" y="318.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">еда, не еда или бутылка</text><line x1="628" y1="302" x2="686" y2="302" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="686" y="264" width="280" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="826.0" y="296.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Категория из девяти</text><text x="826.0" y="318.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">строго из тегов каталога</text><line x1="826" y1="340" x2="826" y2="400" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="686" y="400" width="280" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="826.0" y="432.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Вина с этим тегом</text><text x="826.0" y="454.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">весь каталог, не выборка</text><line x1="686" y1="438" x2="628" y2="438" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="348" y="400" width="280" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="488.0" y="432.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Сортировка правилами</text><text x="488.0" y="454.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">и разнообразие по винодельням</text><line x1="348" y1="438" x2="290" y2="438" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="400" width="250" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="165.0" y="432.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Шесть вин</text><text x="165.0" y="454.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">с объяснением выбора</text><rect x="1006" y="264" width="154" height="76" rx="10" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="1083.0" y="296.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Бутылка?</text><text x="1083.0" y="318.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">предложим скан</text><line x1="966" y1="302" x2="1006" y2="302" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="1006" y="400" width="154" height="116" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="1022" y="426" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Без модели</text><text x="1022" y="450" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">zero-shot</text><text x="1022" y="470" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">по картинке,</text><text x="1022" y="490" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">иначе спросим</text><text x="1022" y="510" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">категорию</text><text x="40" y="512" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">Бутылку за еду не приняли ни разу: 100 фото из 100. Объяснение к каждому вину — из каталога и правил, без модели.</text></svg>
