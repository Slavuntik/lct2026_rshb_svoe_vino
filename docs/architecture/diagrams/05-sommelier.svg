<?xml version="1.0" encoding="UTF-8"?>
<svg color="#241118" viewBox="0 0 1200 624" role="img" aria-label="Цепочка ответа сомелье: разбор запроса, поиск, порог отказа, модель и цитаты" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A52"/></marker></defs><rect x="40" y="64" width="300" height="88" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="190.0" y="102.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Вопрос пользователя</text><text x="190.0" y="124.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">плюс слаг вина, если пришли из карточки</text><line x1="340" y1="108" x2="400" y2="108" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="400" y="48" width="300" height="120" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="416" y="74" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Разбор запроса</text><text x="416" y="98" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">цвет, сахар, регион из текста</text><text x="416" y="118" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">тип вопроса: подбор или справка</text><text x="416" y="138" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">слаг вина закрепляет кандидата №1</text><line x1="700" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="760" y="48" width="190" height="56" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="855.0" y="70.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">BM25</text><text x="855.0" y="92.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">точные слова</text><rect x="760" y="116" width="190" height="56" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="855.0" y="138.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Плотный поиск</text><text x="855.0" y="160.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">смысл</text><line x1="950" y1="76" x2="1010" y2="108" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="950" y1="144" x2="1010" y2="116" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1010" y="76" width="150" height="72" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="1085.0" y="106.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Реранкер</text><text x="1085.0" y="128.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">пересортировка</text><polyline points="1085,148 1085,196 600,196 600,236" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="450" y="236" width="300" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="600.0" y="268.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Порог отказа</text><text x="600.0" y="290.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">калиброван по эталонным вопросам</text><line x1="450" y1="274" x2="340" y2="274" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="395.0" y="266.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">пусто</text><rect x="40" y="236" width="300" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="190.0" y="268.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Честный отказ</text><text x="190.0" y="290.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">«данных нет» вместо выдумки</text><line x1="600" y1="312" x2="600" y2="372" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="450" y="372" width="300" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="600.0" y="404.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Промпт с карточками</text><text x="600.0" y="426.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">только найденные вина и статьи</text><line x1="750" y1="410" x2="810" y2="410" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="810" y="372" width="350" height="76" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="985.0" y="404.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Qwen 27B через свой шлюз</text><text x="985.0" y="426.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">поток слов, ссылки [n]</text><line x1="985" y1="448" x2="985" y2="508" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="810" y="508" width="350" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="985.0" y="540.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Ответ с цитатами</text><text x="985.0" y="562.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">каждая ведёт в карточку каталога</text><rect x="40" y="372" width="380" height="212" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="56" y="398" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Что это даёт</text><text x="56" y="422" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">сомелье говорит только о винах каталога</text><text x="56" y="442" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">вопрос про отсканированное вино попадает</text><text x="56" y="462" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">в цель в 100% случаев на всех 2103 винах</text><text x="56" y="482" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">ложных отказов на типовых вопросах нет</text></svg>
