<?xml version="1.0" encoding="UTF-8"?>
<svg color="#241118" viewBox="0 0 1200 640" role="img" aria-label="Бюджеты времени и лестница деградации при отказе модели" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A52"/></marker></defs><text x="40" y="48" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="16" fill="currentColor" opacity="1">Время одного запроса</text><rect x="40" y="72" width="1120" height="42" rx="8" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.5"/><line x1="40.0" y1="60" x2="40.0" y2="126" stroke="currentColor" stroke-width="1.6"/><text x="40.0" y="148" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor">t0</text><line x1="712.0" y1="60" x2="712.0" y2="126" stroke="#A63A52" stroke-width="1.6"/><text x="712.0" y="148" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#A63A52">6,0 с — дальше модель не ждём</text><line x1="880.0" y1="60" x2="880.0" y2="126" stroke="currentColor" stroke-width="1.6"/><text x="880.0" y="148" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor">7,5 с — бюджет всего скана</text><line x1="1160.0" y1="60" x2="1160.0" y2="126" stroke="currentColor" stroke-width="1.6"/><text x="1160.0" y="148" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor">10 с — лимит скрипта жюри</text><rect x="40" y="72" width="672" height="42" rx="8" fill="#A63A52" opacity="0.12"/><text x="56" y="99" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#A63A52" opacity="0.95">окно, в котором модель ещё может ответить</text><text x="40" y="208" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="16" fill="currentColor" opacity="1">Что происходит, когда звено отвалилось</text><rect x="40" y="232" width="250" height="72" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="165.0" y="262.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Модель 27B на шлюзе</text><text x="165.0" y="284.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">лучший текст этикетки</text><line x1="290" y1="268" x2="348" y2="268" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="319.0" y="252" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">нет ответа за 6 с</text><rect x="348" y="232" width="250" height="72" rx="10" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="473.0" y="262.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Локальная модель 4B</text><text x="473.0" y="284.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">только на Mac, без сети</text><line x1="598" y1="268" x2="656" y2="268" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="627.0" y="252" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">нет или не настроена</text><rect x="656" y="232" width="250" height="72" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="781.0" y="262.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">OCR на процессоре</text><text x="781.0" y="284.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">всегда доступен</text><line x1="906" y1="268" x2="964" y2="268" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="252" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">текста нет</text><rect x="964" y="232" width="196" height="72" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="1062.0" y="262.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Только зрение</text><text x="1062.0" y="284.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">ответ всё равно есть</text><rect x="40" y="352" width="540" height="96" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="310.0" y="394.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Предохранитель</text><text x="310.0" y="416.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">три сбоя подряд — модель пропускается 60 секунд, сканы сразу идут локально; потом одна проба</text><rect x="620" y="352" width="540" height="96" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="636" y="378" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Проверено не на бумаге</text><text x="636" y="402" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">четыре вида отказа шлюза, 60 ответов из 60 вовремя</text><text x="636" y="422" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">реальный сбой 26.09: 100 фото, 0 ошибок, точность 95,2%</text><text x="40" y="500" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="16" fill="currentColor" opacity="1">Точность по режимам</text><rect x="40" y="524" width="356" height="76" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="218.0" y="556.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Модель ответила</text><text x="218.0" y="578.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">96,8% топ-1 · 98,4% топ-5</text><rect x="422" y="524" width="356" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="600.0" y="556.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Модель молчит</text><text x="600.0" y="578.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">95,2% топ-1 — путь на процессоре</text><rect x="804" y="524" width="356" height="76" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="982.0" y="556.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Ошибок пользователю</text><text x="982.0" y="578.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">ноль: ответ отдаётся всегда</text></svg>
