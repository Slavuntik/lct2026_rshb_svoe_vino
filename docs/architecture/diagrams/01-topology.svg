ont-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Второй разработчик</text><text x="878.0" y="100.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">сервис витрин, отдельный GPU</text><line x1="206" y1="116" x2="206" y2="176" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="206.0" y="138.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">HTTPS</text><line x1="542" y1="116" x2="542" y2="176" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><text x="542.0" y="138.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">POST фото</text><rect x="56" y="176" width="972" height="56" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="542.0" y="198.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">nginx на стенде</text><text x="542.0" y="220.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">статика приложения, прокси на API, лимит тела 26 МБ</text><line x1="542" y1="232" x2="542" y2="288" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="56" y="288" width="972" height="60" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="542.0" y="312.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">FastAPI — один процесс, один воркер</text><text x="542.0" y="334.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">маршруты скана, чата, подбора, метрик; общий бюджет запроса 7,5 с</text><line x1="220" y1="348" x2="220" y2="408" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="542" y1="348" x2="542" y2="408" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="864" y1="348" x2="864" y2="408" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="56" y="408" width="300" height="132" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="72" y="434" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Распознавание</text><text x="72" y="458" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">SigLIP2 base-384 — эмбеддинги</text><text x="72" y="478" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">RapidOCR — текст этикетки</text><text x="72" y="498" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">слияние и гейты уверенности</text><rect x="392" y="408" width="300" height="132" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="408" y="434" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Поиск для сомелье</text><text x="408" y="458" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">BM25 + плотный поиск</text><text x="408" y="478" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">реранкер, порог отказа</text><text x="408" y="498" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">встроенный Qdrant</text><rect x="728" y="408" width="300" height="132" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="744" y="434" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Драйвер моделей</text><text x="744" y="458" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">OpenAI-совместимый</text><text x="744" y="478" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">дедлайн и предохранитель</text><text x="744" y="498" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.75">заглушка как запасной путь</text><rect x="24" y="568" width="1152" height="132" rx="12" stroke="currentColor" stroke-width="1" stroke-dasharray="4 5" fill="none" opacity="0.45"/><text x="38" y="588" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" letter-spacing="1.2" fill="currentColor" opacity="0.6">ДАННЫЕ, КОТОРЫЕ ВЕЗЁМ САМИ</text><rect x="56" y="596" width="300" height="80" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="206.0" y="630.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Каталог кейса</text><text x="206.0" y="652.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">2103 позиции — источник слагов</text><rect x="392" y="596" width="300" height="80" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="542.0" y="630.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Индекс сканера</text><text x="542.0" y="652.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">2058 эталонов × 6 ракурсов</text><rect x="728" y="596" width="300" height="80" rx="10" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="878.0" y="630.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Индекс сомелье</text><text x="878.0" y="652.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">2103 вина, 138 виноделен, 5592 фрагмента</text><line x1="206" y1="540" x2="206" y2="596" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="542" y1="540" x2="542" y2="596" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="878" y1="540" x2="810" y2="596" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="728" y="716" width="300" height="64" rx="10" stroke="#A63A52" stroke-width="1.6" fill="none"/><text x="878.0" y="742.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#A63A52">Свой GPU-шлюз</text><text x="878.0" y="764.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">Qwen 27B: этикетка и ответы сомелье</text><line x1="1028" y1="470" x2="1120" y2="470" stroke="#A63A52" stroke-width="1.6" marker-end="url(#arrow-acc)"/><polyline points="1120,470 1150,470 1150,748 1028,748" fill="none" stroke="#A63A52" stroke-width="1.6" marker-end="url(#arrow-acc)"/><text x="1146" y="610" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#A63A52" opacity="0.7">≤ 6 с</text><rect x="56" y="716" width="636" height="64" rx="10" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="374.0" y="742.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Mac для ночи проверки</text><text x="374.0" y="764.0" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.72">тот же код + локальная модель 4B рядом, работает без сети</text><line x1="374" y1="540" x2="374" y2="716" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="384" y="620.0" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="currentColor" opacity="0.9">та же сборка</text></svg>
