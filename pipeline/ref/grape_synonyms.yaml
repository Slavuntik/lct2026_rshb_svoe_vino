# Справочник сортов винограда.
# Наш IP: нормализация написаний + мост «российский сорт <-> мировая классика».
# Мост используется в задаче F3 (подбор российского аналога импортному вину).
#
# Поля:
#   synonyms   — варианты написания, встречающиеся на портале и в статьях
#   role       — как ведёт себя в купаже/моносорте
#   equivalent — мировые сорта близкого профиля (для обратного матчинга)
#   profile    — грубая опорная точка сенсорики, уточняется по описанию вина
#
# СТАТУС: покрывает все 118 неопознанных написаний с портала (прогон
# 2026-08-25, 1978 вин). profile проставлен там, где сортовой профиль
# описан в литературе. У малоизученных советских гибридов profile
# намеренно отсутствует — по правилу «ничего не досочинять»: сорт
# опознаётся, но сенсорика остаётся невыведенной и confidence не растёт.

# Служебные значения портала: в поле сорта, но сортами не являются.
# normalize пропускает их молча, не засоряя список неопознанных.
non_grapes:
  - Белые сорта винограда
  - Красные сорта винограда

