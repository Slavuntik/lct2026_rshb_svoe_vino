# Правила гастропар — детерминированное ядро задачи F2.
#
# Принцип: LLM НЕ выбирает вино. LLM только формулирует объяснение поверх
# уже принятого решения. Одинаковый ввод -> одинаковый вывод, каждое
# правило трассируется в ответе.
#
# Скоринг: score = sum(rule.weight * rule.satisfied) - sum(penalty)
# Итог нормируется в 0..1, в ответ идут топ-N с перечнем сработавших правил.
#
# Категории блюд синхронизированы с тегами портала (ref/taxonomy.yaml),
# плюс наши внутренние признаки блюда, которые извлекает парсер запроса.

version: 0.1

# --------------------------------------------------------------------------
# Признаки блюда, которые извлекаются из пользовательского запроса
# --------------------------------------------------------------------------
dish_features:
  fat: {scale: [0, 1], desc: жирность, сливочность}
  protein_heavy: {scale: [0, 1], desc: доля плотного белка}
  acidity: {scale: [0, 1], desc: кислотность блюда, цитрус, уксус}
  sweetness: {scale: [0, 1], desc: сладость блюда}
  spice: {scale: [0, 1], desc: острота, чили, перец}
  umami: {scale: [0, 1], desc: грибы, выдержанный сыр, соя, томат}
  smoke: {scale: [0, 1], desc: копчение, гриль, BBQ}
  weight: {scale: [0, 1], desc: общая тяжесть блюда}
  salt: {scale: [0, 1], desc: солёность}

# --------------------------------------------------------------------------
# Ключевое правило проекта: соус важнее основного продукта
# --------------------------------------------------------------------------
feature_extraction:
  sauce_dominance: 0.65
  protein_dominance: 0.35
  note: >
    При наличии выраженного соуса его признаки весят больше, чем признаки
    основного продукта. Курица в сливочном соусе — это «жирное белое блюдо»,
    а не «птица». Курица в томатном — кислотное. Это типовая ошибка наивных
    реализаций и наш демонстрационный кейс на защите.

# --------------------------------------------------------------------------
# Правила соответствия
# --------------------------------------------------------------------------
rules:

  - id: fat_needs_acidity
    when: {dish.fat: ">=0.6"}
    require: {wine.acidity: ">=0.65"}
    weight: 1.0
    explain: жирность блюда требует высокой кислотности вина, иначе вкус тяжелеет

  - id: protein_needs_tannin
    when: {dish.protein_heavy: ">=0.6", dish.weight: ">=0.5"}
    require: {wine.tannin: ">=0.55"}
    weight: 1.0
    explain: танины связываются с белком и смягчаются, поэтому мясо просит красное плотное

  - id: spice_needs_sugar
    when: {dish.spice: ">=0.5"}
    require: {wine.sweetness: ">=0.3", wine.abv_percent: "<=13.0"}
    weight: 1.2
    explain: остаточный сахар гасит остроту, высокий алкоголь её усиливает

  - id: spice_avoids_tannin
    when: {dish.spice: ">=0.6"}
    penalize: {wine.tannin: ">=0.6"}
    weight: 0.9
    explain: танины на острых блюдах дают горечь

  - id: sweet_dish_needs_sweeter_wine
    when: {dish.sweetness: ">=0.5"}
    require: {wine.sweetness: ">=dish.sweetness"}
    weight: 1.3
    explain: вино слаще блюда, иначе оно кажется кислым и пустым

  - id: weight_matches_body
    when: {always: true}
    require: {wine.body: "~=dish.weight ± 0.2"}
    weight: 1.0
    explain: вес блюда и тельность вина должны совпадать

  - id: acid_dish_needs_acid_wine
    when: {dish.acidity: ">=0.6"}
    require: {wine.acidity: ">=0.65"}
    weight: 0.9
    explain: вино с меньшей кислотностью, чем блюдо, кажется вялым

  - id: umami_needs_maturity
    when: {dish.umami: ">=0.6"}
    require: {wine.aromatic_intensity: ">=0.6"}
    penalize: {wine.tannin: ">=0.75"}
    weight: 0.8
    explain: умами усиливает восприятие танинов и горечи, нужна зрелая ароматика

  - id: smoke_matches_oak
    when: {dish.smoke: ">=0.6"}
    require: {wine.oak: ">=0.4"}
    weight: 0.8
    explain: копчёные и грилевые ноты перекликаются с бочковой выдержкой

  - id: salt_loves_bubbles
    when: {dish.salt: ">=0.6"}
    require: {wine.bubbles: ">=0.4"}
    weight: 0.7
    explain: соль и пузырьки взаимно освежают, классика с устрицами и закусками

  - id: regional_affinity
    when: {dish.cuisine_region: "matches wine.region"}
    weight: 0.4
    kind: bonus
    explain: что растёт вместе, то и пьётся вместе

# --------------------------------------------------------------------------
# Прямые соответствия под теги портала — быстрый путь без разбора признаков
# --------------------------------------------------------------------------
portal_tag_defaults:
  Устрицы:      {acidity: 0.85, body: 0.35, salt: 0.9, weight: 0.2}
  Сыры:         {fat: 0.7, salt: 0.7, umami: 0.6, weight: 0.5}
  Блюда из рыбы: {fat: 0.4, protein_heavy: 0.5, weight: 0.4}
  Блюда из птицы: {fat: 0.5, protein_heavy: 0.55, weight: 0.5}
  Салаты:       {acidity: 0.7, weight: 0.25, fat: 0.3}
  Брускетты:    {acidity: 0.6, salt: 0.6, weight: 0.3}
  BBQ:          {smoke: 0.9, fat: 0.7, protein_heavy: 0.85, weight: 0.85}
  Азиатская кухня: {spice: 0.7, umami: 0.7, sweetness: 0.4, weight: 0.5}
  Выпечка и десерты: {sweetness: 0.8, fat: 0.6, weight: 0.6}

# --------------------------------------------------------------------------
# Жёсткие запреты — отсекаются до скоринга
# --------------------------------------------------------------------------
hard_blocks:
  - id: dry_wine_with_dessert
    condition: {dish.sweetness: ">=0.6", wine.sweetness: "<=0.15"}
    reason: сухое вино с десертом читается как кислое и пустое

  - id: heavy_red_with_delicate_fish
    condition: {dish.weight: "<=0.3", wine.tannin: ">=0.7"}
    reason: танины перекрывают деликатное блюдо и дают металлический тон

# --------------------------------------------------------------------------
# Что отдаём пользователю
# --------------------------------------------------------------------------
output_contract:
  top_n: 3
  must_include:
    - wine_slug
    - score
    - triggered_rules   # список id + explain, это и есть «почему подобрали»
    - source_url        # ссылка на карточку портала
  never_include:
    - утверждения о пользе алкоголя для здоровья
    - побуждение к увеличению количества
