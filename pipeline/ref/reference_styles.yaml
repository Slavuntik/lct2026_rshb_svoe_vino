# Эталонные импортные стили — ядро задачи F3 «российский аналог».
#
# Логика: пользователь называет знакомое импортное вино или аппелласьон
# («люблю Шабли», «нравится Кьянти»). Мы сводим его к эталонному стилю,
# получаем сенсорный вектор + сортовой профиль, и ищем ближайшее российское
# в каталоге по вектору с жёсткими фильтрами (цвет, категория, игристость).
#
# ЖЁСТКИЕ ФИЛЬТРЫ (матчер отсеивает стиль, если не совпало):
#   color      — цвет вина; обязателен у всех стилей, кроме заведомо мультицветных
#   stillness  — тихое | игристое; обязателен у всех
#   sugar      — допустимые категории по сахару; пустой список = любая
# Держать эти три поля заполненными важно: без stillness тихое вино
# матчилось с пет-натом и Moscato d'Asti (223 случая на прогоне 2026-08-25).
#
# match_hints.must — свободный текст, для человека. Матчер его НЕ читает,
# все машинные ограничения живут в color/stillness/sugar/avoid_grapes.
#
# sensory: sweetness, acidity, tannin, body, oak, aromatic_intensity, bubbles.
# Задавать минимум 4 измерения — матчер требует не менее 3 общих с вином,
# иначе стиль в сравнении не участвует.

# СТАТУС: 146 стилей. Прогон 2026-08-25 по 1978 винам при пороге 0.80:
# аналог нашёлся у 95% вин, задействован 121 стиль из 146. 25 стилей
# остались без российского аналога (херес, чаколи, пинотаж, неро д'Авола,
# шатонёф-дю-пап) — это valid-ответ «аналога нет», а не пробел в данных.

